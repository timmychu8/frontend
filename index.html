<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="持股雷達">
<meta name="theme-color" content="#04060c">
<meta name="format-detection" content="telephone=no">
<title>台股零股持股雷達</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<style>
:root{
  --tx:#f4f6fb; --tx2:rgba(236,241,250,.70); --tx3:rgba(236,241,250,.44);
  --card:rgba(255,255,255,.065); --card2:rgba(255,255,255,.11); --bg2:rgba(0,0,0,.24);
  --stroke:rgba(255,255,255,.13); --stroke2:rgba(255,255,255,.22); --line:rgba(255,255,255,.08);
  --hl:inset 0 1px 0 rgba(255,255,255,.16), inset 0 -1px 0 rgba(255,255,255,.03);
  --glass-blur:blur(26px) saturate(180%);
  --accent:#64a8ff; --red:#ff6b78; --green:#34d996; --yellow:#ffcf5a;
  --red-bg:rgba(255,107,120,.16); --green-bg:rgba(52,217,150,.15); --yellow-bg:rgba(255,207,90,.15); --blue-bg:rgba(100,168,255,.16);
  --up:#ff6b78; --down:#34d996;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
  --bar-h:48px; --nav-h:66px; --nav-bottom:max(10px, calc(var(--sab) - 12px));
}
body.intl{ --up:#34d996; --down:#ff6b78; }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;background:#04060c}
body{margin:0;height:100vh;height:100dvh;overflow:hidden;background:#04060c;color:var(--tx);
  font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  -webkit-text-size-adjust:100%;overscroll-behavior:none;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}

/* ---------- 背景光暈（讓玻璃有東西可以透） ---------- */
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;background:#04060c}
.bg i{position:absolute;border-radius:50%}
.bg .b1{width:120vw;height:120vw;left:-45vw;top:-40vw;background:radial-gradient(circle,rgba(46,108,255,.55) 0%,rgba(46,108,255,0) 68%)}
.bg .b2{width:110vw;height:110vw;right:-50vw;top:28vh;background:radial-gradient(circle,rgba(139,92,246,.42) 0%,rgba(139,92,246,0) 68%)}
.bg .b3{width:120vw;height:120vw;left:-20vw;bottom:-60vw;background:radial-gradient(circle,rgba(20,184,166,.36) 0%,rgba(20,184,166,0) 68%)}

/* ---------- 上方玻璃標題列（往下滑才出現） ---------- */
header{position:fixed;top:0;left:0;right:0;z-index:30;padding-top:var(--sat);pointer-events:none}
header::before{content:'';position:absolute;inset:0;background:rgba(12,16,28,.52);
  -webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur);
  border-bottom:.5px solid var(--stroke);opacity:0;transition:opacity .28s ease}
body.scrolled header::before{opacity:1}
header .bar{position:relative;height:var(--bar-h);display:flex;align-items:center;justify-content:center;padding:0 calc(var(--sar) + 16px) 0 calc(var(--sal) + 16px)}
#miniTitle{font-size:17px;font-weight:650;letter-spacing:.2px;opacity:0;transform:translateY(8px);transition:.28s ease}
body.scrolled #miniTitle{opacity:1;transform:none}
#hdrCount{position:absolute;right:calc(var(--sar) + 16px);pointer-events:auto}
#topbar{position:absolute;left:0;bottom:-1px;height:2px;width:0;background:linear-gradient(90deg,#64a8ff,#a78bfa);transition:width .3s;box-shadow:0 0 10px rgba(100,168,255,.8)}

/* ---------- 捲動內容 ---------- */
main{position:fixed;inset:0;z-index:10;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;
  padding:calc(var(--sat) + var(--bar-h) - 4px) calc(var(--sar) + 16px) calc(var(--nav-bottom) + var(--nav-h) + 26px) calc(var(--sal) + 16px)}
.large{margin:0 2px 18px}
.large h1{margin:0;font-size:34px;line-height:1.15;font-weight:800;letter-spacing:.3px}
.large .sub{margin-top:4px;font-size:13.5px;color:var(--tx2)}

/* ---------- 懸浮膠囊分頁列（Liquid Glass） ---------- */
nav{position:fixed;z-index:30;left:calc(var(--sal) + 14px);right:calc(var(--sar) + 14px);bottom:var(--nav-bottom);
  height:var(--nav-h);border-radius:999px;display:flex;padding:5px;
  background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,.04)),rgba(22,28,44,.40);
  -webkit-backdrop-filter:blur(30px) saturate(190%);backdrop-filter:blur(30px) saturate(190%);
  border:.5px solid var(--stroke2);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.25),inset 0 -1px 0 rgba(255,255,255,.05),0 14px 40px rgba(0,0,0,.55)}
#navPill{position:absolute;top:5px;bottom:5px;left:5px;width:calc((100% - 10px) / 4);border-radius:999px;
  background:linear-gradient(180deg,rgba(255,255,255,.18),rgba(255,255,255,.07));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35),inset 0 0 0 .5px rgba(255,255,255,.14),0 4px 14px rgba(0,0,0,.25);
  transition:transform .42s cubic-bezier(.34,1.45,.55,1)}
nav button{position:relative;z-index:1;flex:1;background:none;border:0;color:var(--tx3);font:inherit;font-size:10.5px;font-weight:600;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:0;transition:color .25s}
nav button svg{width:25px;height:25px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:#fff}
nav button.on svg{stroke:var(--accent);filter:drop-shadow(0 0 6px rgba(100,168,255,.55))}
nav .dot{position:absolute;top:4px;left:calc(50% + 6px);min-width:18px;height:18px;border-radius:9px;background:var(--red);color:#fff;font-size:10.5px;font-weight:700;
  display:flex;align-items:center;justify-content:center;padding:0 5px;box-shadow:0 0 0 2px rgba(22,28,44,.8)}

/* ---------- 玻璃元件 ---------- */
section{display:none} section.on{display:block;animation:fadein .25s ease}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.card{background:var(--card);border:.5px solid var(--stroke);border-radius:24px;padding:16px;margin-bottom:12px;
  -webkit-backdrop-filter:blur(22px) saturate(160%);backdrop-filter:blur(22px) saturate(160%);
  box-shadow:var(--hl),0 10px 28px rgba(0,0,0,.28)}
.card h3{margin:0 0 10px;font-size:17px;font-weight:700}
.muted{color:var(--tx2)} .faint{color:var(--tx3)} .small{font-size:12.5px} .mono{font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:8px} .between{justify-content:space-between} .wrap{flex-wrap:wrap} .grow{flex:1;min-width:0}
.btn{appearance:none;border:.5px solid var(--stroke);background:rgba(255,255,255,.09);color:var(--tx);border-radius:16px;padding:11px 14px;
  font:inherit;font-size:15px;font-weight:650;min-height:46px;box-shadow:var(--hl);
  -webkit-backdrop-filter:blur(20px) saturate(170%);backdrop-filter:blur(20px) saturate(170%);transition:transform .15s,opacity .15s}
.btn:active{transform:scale(.97);opacity:.85}
.btn.pri{background:linear-gradient(180deg,rgba(110,175,255,.95),rgba(60,122,245,.95));border-color:rgba(255,255,255,.28);color:#fff;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 8px 22px rgba(60,122,245,.38)}
.btn.ai{background:linear-gradient(135deg,rgba(150,115,255,.95),rgba(80,140,255,.95));border-color:rgba(255,255,255,.28);color:#fff;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 8px 22px rgba(120,100,255,.35)}
.btn.danger{color:var(--red);border-color:rgba(255,107,120,.35)}
.btn.sm{padding:7px 12px;min-height:34px;font-size:13px;border-radius:999px}
.btn[disabled]{opacity:.45}
.full{width:100%}
input,select,textarea{font:inherit;font-size:16px;color:var(--tx);background:rgba(0,0,0,.26);border:.5px solid var(--stroke);border-radius:14px;
  padding:12px 14px;width:100%;outline:none;box-shadow:inset 0 1px 2px rgba(0,0,0,.25);-webkit-appearance:none;appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,var(--tx2) 50%),linear-gradient(135deg,var(--tx2) 50%,transparent 50%);
  background-position:calc(100% - 20px) 52%,calc(100% - 14px) 52%;background-size:6px 6px;background-repeat:no-repeat;padding-right:36px}
input[type=search]{border-radius:999px;background:rgba(255,255,255,.08);padding-left:16px}
input:focus,select:focus,textarea:focus{border-color:rgba(100,168,255,.7);box-shadow:0 0 0 3px rgba(100,168,255,.18)}
textarea{min-height:140px;font-family:ui-monospace,Menlo,monospace;font-size:14px}
label.f{display:block;font-size:13px;color:var(--tx2);margin:12px 0 6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--card);border:.5px solid var(--stroke);border-radius:20px;padding:12px 4px;text-align:center;box-shadow:var(--hl);
  -webkit-backdrop-filter:blur(22px) saturate(160%);backdrop-filter:blur(22px) saturate(160%)}
.stat b{display:block;font-size:26px;line-height:1.1;font-weight:800;font-variant-numeric:tabular-nums}
.stat span{font-size:11.5px;color:var(--tx2)}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:4px 10px;font-size:12.5px;font-weight:650;line-height:1.35;
  background:rgba(255,255,255,.09);color:var(--tx2);border:.5px solid rgba(255,255,255,.08)}
.chip.red{background:var(--red-bg);color:var(--red);border-color:rgba(255,107,120,.22)} .chip.green{background:var(--green-bg);color:var(--green);border-color:rgba(52,217,150,.2)}
.chip.yellow{background:var(--yellow-bg);color:var(--yellow);border-color:rgba(255,207,90,.2)} .chip.info{background:var(--blue-bg);color:var(--accent);border-color:rgba(100,168,255,.2)}
#hdrCount{background:rgba(255,255,255,.12);color:var(--tx);border-color:var(--stroke);box-shadow:var(--hl);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.seg{display:flex;gap:6px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none} .seg::-webkit-scrollbar{display:none}
.seg button{flex:none;border:.5px solid var(--stroke);background:rgba(255,255,255,.08);color:var(--tx2);border-radius:999px;padding:7px 14px;font:inherit;font-size:13.5px;font-weight:600;
  box-shadow:var(--hl);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px)}
.seg button.on{background:linear-gradient(180deg,rgba(110,175,255,.9),rgba(60,122,245,.9));border-color:rgba(255,255,255,.28);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
.alert{position:relative;overflow:hidden}
.alert::before{content:'';position:absolute;left:0;top:14px;bottom:14px;width:4px;border-radius:0 4px 4px 0;background:var(--line)}
.alert.red::before{background:var(--red);box-shadow:0 0 12px var(--red)} .alert.green::before{background:var(--green);box-shadow:0 0 12px var(--green)} .alert.yellow::before{background:var(--yellow);box-shadow:0 0 12px var(--yellow)}
.code{font-weight:800;font-size:17px;font-variant-numeric:tabular-nums} .nm{font-weight:650}
.verdict{margin-top:12px;border-radius:16px;padding:12px 14px;font-size:14px;border:.5px solid rgba(255,255,255,.1)}
.verdict.red{background:var(--red-bg)} .verdict.green{background:var(--green-bg)} .verdict.yellow{background:var(--yellow-bg)}
.verdict h4{margin:0 0 4px;font-size:15px}
.verdict ul{margin:4px 0 0;padding-left:18px} .verdict li{margin:2px 0}
.list .item{display:flex;align-items:center;gap:12px;padding:13px 2px;border-bottom:.5px solid var(--line)}
.list .item:last-child{border-bottom:0}
.badge{min-width:28px;height:28px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:800;flex:none}
.badge.red{background:var(--red);color:#fff;box-shadow:0 0 12px rgba(255,107,120,.55)} .badge.green{background:var(--green);color:#03361f;box-shadow:0 0 12px rgba(52,217,150,.45)}
.badge.yellow{background:var(--yellow);color:#4a3500;box-shadow:0 0 12px rgba(255,207,90,.4)} .badge.none{background:rgba(255,255,255,.08);color:var(--tx3)}
.up{color:var(--up)} .down{color:var(--down)}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kv div{background:rgba(255,255,255,.05);border:.5px solid rgba(255,255,255,.06);border-radius:14px;padding:9px 10px}
.kv small{display:block;color:var(--tx3);font-size:11.5px} .kv b{font-size:15px;font-variant-numeric:tabular-nums}
.detail{background:rgba(0,0,0,.22);border:.5px solid rgba(255,255,255,.07);border-radius:20px;padding:14px;margin:2px 0 12px}
.detail h5{margin:16px 0 8px;font-size:13.5px;color:var(--tx2);font-weight:650}
.detail h5:first-child{margin-top:0}
.news{background:rgba(255,255,255,.06);border:.5px solid rgba(255,255,255,.07);border-radius:14px;padding:10px 12px;margin-bottom:6px;font-size:13.5px}
.news details summary{list-style:none;cursor:pointer} .news details summary::-webkit-details-marker{display:none}
.news pre{white-space:pre-wrap;word-break:break-word;font:inherit;font-size:13px;color:var(--tx2);margin:8px 0 0;max-height:320px;overflow:auto}
.prog{height:6px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden;flex:1}
.prog i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s;border-radius:3px}
.prog i.ok{background:var(--green)} .prog i.err{background:var(--red)} .prog i.empty{background:var(--yellow)}
.dsrow{display:flex;align-items:center;gap:8px;font-size:13px;padding:5px 0}
.dsrow .lb{width:118px;flex:none;color:var(--tx2)} .dsrow .st{width:64px;flex:none;text-align:right;color:var(--tx3);font-size:12px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
td,th{padding:9px 4px;border-bottom:.5px solid var(--line);text-align:left} th{color:var(--tx3);font-weight:500;font-size:12px}
td.r,th.r{text-align:right}
.empty{text-align:center;padding:48px 16px;color:var(--tx2)}
.empty .big{font-size:46px;margin-bottom:10px}
#toast{position:fixed;left:50%;bottom:calc(var(--nav-bottom) + var(--nav-h) + 16px);transform:translateX(-50%) translateY(16px) scale(.96);opacity:0;
  background:rgba(40,48,70,.6);-webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur);border:.5px solid var(--stroke2);
  color:#fff;padding:11px 18px;border-radius:999px;font-size:14.5px;font-weight:600;transition:.3s cubic-bezier(.34,1.4,.55,1);pointer-events:none;z-index:50;max-width:92vw;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 10px 30px rgba(0,0,0,.45)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
svg.chart{width:100%;height:64px;display:block}
.hint{font-size:12.5px;color:var(--tx3);margin-top:6px;line-height:1.6}
.sep{height:.5px;background:var(--line);margin:14px 0}
.offline{background:var(--yellow-bg);color:var(--yellow);font-size:12.5px;padding:8px 12px;border-radius:14px;margin-bottom:12px;display:none}
#updBar{position:fixed;z-index:40;left:50%;top:calc(var(--sat) + 8px);transform:translate(-50%,-140%);transition:transform .45s cubic-bezier(.34,1.45,.55,1);
  display:flex;align-items:center;gap:8px;padding:10px 18px;border-radius:999px;font:inherit;font-size:14.5px;font-weight:700;color:#fff;border:.5px solid rgba(255,255,255,.3);
  background:linear-gradient(135deg,rgba(150,115,255,.85),rgba(80,140,255,.85));-webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 10px 30px rgba(80,120,255,.45);white-space:nowrap}
#updBar.show{transform:translate(-50%,0)}
code{font-family:ui-monospace,Menlo,monospace;font-size:.92em;background:rgba(255,255,255,.08);padding:1px 6px;border-radius:6px}
</style>
</head>
<body>
<div class="bg"><i class="b1"></i><i class="b2"></i><i class="b3"></i></div>
<div class="app">
  <header>
    <div class="bar"><div id="miniTitle">異常警報</div><span id="hdrCount" class="chip"></span></div>
    <div id="topbar"></div>
  </header>

  <main id="main">
    <div class="large"><h1 id="bigTitle">異常警報</h1><div class="sub" id="hdrSub">尚未更新官方數據</div></div>
    <div class="offline" id="offline">離線中：顯示的是上次更新的本機資料</div>
    <section id="tab-alerts" class="on"></section>
    <section id="tab-radar"></section>
    <section id="tab-holdings"></section>
    <section id="tab-settings"></section>
  </main>

  <nav id="nav">
    <div id="navPill"></div>
    <button data-tab="alerts" class="on"><svg viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0-6 6v4l-2 3h16l-2-3V9a6 6 0 0 0-6-6z"/><path d="M10 19a2 2 0 0 0 4 0"/></svg>異常警報<span class="dot" id="navDot" style="display:none"></span></button>
    <button data-tab="radar"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><path d="M12 12l6-6"/><circle cx="12" cy="12" r="1.2" fill="currentColor"/></svg>持股雷達</button>
    <button data-tab="holdings"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M8 9h8M8 13h8M8 17h5"/></svg>名單管理</button>
    <button data-tab="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>設定</button>
  </nav>
</div>
<div id="toast"></div>
<button id="updBar" type="button">✨ 有新版本，點一下更新</button>
<input type="file" id="fileCsv" accept=".csv,.txt,text/csv,text/plain" hidden>
<input type="file" id="fileJson" accept=".json,application/json" hidden>
<input type="file" id="filePdf" accept=".pdf,application/pdf" multiple hidden>

<script>
'use strict';
const APP_VERSION = '2026.11.24-r6'; // 每次更新畫面都要改這個版本號
/* =========================================================
 *  基礎工具
 * ========================================================= */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
function num(v) {
  if (v == null) return null;
  if (typeof v === 'number') return isFinite(v) ? v : null;
  const s = String(v).replace(/[,\s%＋]/g, '').replace(/^\+/, '').replace(/[()]/g, '');
  if (s === '' || s === '-' || s === '--' || s === '---' || /^N\/?A$/i.test(s) || s === '不適用') return null;
  const n = Number(s);
  return isFinite(n) ? n : null;
}
function fmt(n, d = 0) { return n == null ? '—' : Number(n).toLocaleString('zh-TW', { minimumFractionDigits: d, maximumFractionDigits: d }); }
function sgn(n, d = 1, suf = '%') { if (n == null) return '<span class="faint">—</span>'; const c = n > 0 ? 'up' : n < 0 ? 'down' : ''; return `<span class="${c} mono">${n > 0 ? '+' : ''}${fmt(n, d)}${suf}</span>`; }
function toast(msg, ms = 2400) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), ms); }
function twNow() { return new Date(Date.now() + 8 * 3600e3); }
function ymd(d) { return `${d.getUTCFullYear()}${String(d.getUTCMonth() + 1).padStart(2, '0')}${String(d.getUTCDate()).padStart(2, '0')}`; }
function prettyDate(s) { s = String(s || ''); return s.length === 8 ? `${s.slice(0, 4)}/${s.slice(4, 6)}/${s.slice(6)}` : s; }
/** 民國/西元各式日期 → YYYYMMDD */
function normDate(v) {
  if (v == null) return '';
  let s = String(v).trim();
  let m = s.match(/^(\d{2,4})[\/\-.年](\d{1,2})[\/\-.月](\d{1,2})/);
  if (m) { let y = +m[1]; if (y < 1911) y += 1911; return `${y}${m[2].padStart(2, '0')}${m[3].padStart(2, '0')}`; }
  s = s.replace(/\D/g, '');
  if (s.length === 8) return s;
  if (s.length === 7) return `${+s.slice(0, 3) + 1911}${s.slice(3)}`;
  if (s.length === 6) return `${+s.slice(0, 2) + 1911}${s.slice(2)}`; // 民國兩位年（極少見）
  return '';
}
function daysBetween(a, b) { // YYYYMMDD
  const p = s => Date.UTC(+s.slice(0, 4), +s.slice(4, 6) - 1, +s.slice(6, 8));
  return Math.round((p(b) - p(a)) / 864e5);
}

/* ---------- 欄位模糊對應（官方各 API 欄位名中英混用、偶有尾端空白） ---------- */
function fkey(row, inc, exc) { for (const k of Object.keys(row)) { const kk = k.trim(); if (inc.test(kk) && !(exc && exc.test(kk))) return k; } return null; }
function fval(row, inc, exc) { const k = fkey(row, inc, exc); return k == null ? undefined : row[k]; }
function fnum(row, inc, exc) { return num(fval(row, inc, exc)); }
const RE_CODE = /^(公司代號|證券代號|股票代號|代號|有價證券代號|SecuritiesCompanyCode|CompanyCode|StockCode|Code|StockNo)$/i;
const RE_NAME = /^(公司名稱|公司簡稱|證券名稱|股票名稱|名稱|有價證券名稱|CompanyName|CompanyAbbreviation|Name|StockName)$/i;
function rowCode(r) { let v = fval(r, RE_CODE); if (v == null) v = fval(r, /代號|code/i, /產業|industry|型態/i); return v == null ? null : String(v).trim().toUpperCase(); }
function rowName(r) { const v = fval(r, RE_NAME); return v == null ? '' : String(v).trim(); }

const NEWS_NEG = /減資彌補|虧損|停工|停產|違約|跳票|退票|下市|終止上市|終止(上櫃|櫃檯買賣)|變更交易方法|全額交割|分盤交易|處置|重大訴訟|起訴|搜索|羈押|重整|破產|解散|停止營業|停止營運|財務困難|無法表示意見|否定意見|保留意見|繼續經營.{0,6}(疑慮|不確定)|減損損失|鉅額.*損失|背書保證.{0,10}超|資金貸與.{0,10}超|火災|爆炸|災損|裁罰|罰鍰|下修|調降.{0,6}(財測|目標)|(董事長|總經理|執行長|財務主管|會計主管|財會主管).{0,8}(辭|解任|異動|變動)|簽證會計師.{0,6}(異動|更換|變更)|股權.{0,4}(質押|設質)|大量出售/;
const NEWS_HARD = /變更交易方法|全額交割|終止上市|終止(上櫃|櫃檯買賣)|重整|破產|跳票|退票|財務困難|無法表示意見|否定意見/;
const NEWS_ROUTINE = /法說會|法人說明會|受邀|參加.{0,12}(論壇|研討會|座談|展覽|展會|說明會)|股東(常|臨時)會.{0,10}(召開|議事錄|決議|日期|開會)|召開.{0,6}股東(常|臨時)會|開會通知|自結|董事會.{0,10}(通過|決議).{0,10}(財務報告|財報)|財務報告.{0,6}(經|業經)|代子公司.{0,30}(使用權資產|機器設備|設備)|背書保證.{0,6}餘額|資金貸與.{0,6}餘額|補充公告|更正.{0,6}公告|除(權|息).{0,8}(基準日|交易日)|基準日|發放日|股票股利.{0,6}發放|取得.{0,10}(機器|設備|使用權)/;
const NEWS_POS = /庫藏股|買回.{0,6}(本公司)?股份|股利分派|配發.{0,6}股利|現金股利|創.{0,6}新高|調升|上修|得標|簽訂.{0,10}(合約|契約)|取得.{0,6}訂單|策略聯盟/;
const NEWS_WATCH = /減資|私募|併購|合併|收購|公開收購|處分|取得.{0,10}(不動產|股權|有價證券|股份)|董事.{0,8}(異動|辭|解任|改選)|獨立董事|發言人.{0,6}異動|稽核主管|增資|可轉換公司債|轉換公司債|股權轉讓|停止買賣|暫停交易|恢復交易|澄清|媒體報導|子公司.{0,6}(處分|出售)/;
function classifyNews(subject, desc) {
  const s = subject || '';
  if (NEWS_NEG.test(s) || NEWS_HARD.test((desc || '').slice(0, 400))) return 'neg';
  if (NEWS_ROUTINE.test(s)) return 'routine';
  if (NEWS_POS.test(s)) return 'pos';
  if (NEWS_WATCH.test(s)) return 'watch';
  return 'info';
}

function parseT86(obj) {
  // TWSE T86：{stat, date, fields:[...], data:[[...]]}
  const f = obj.fields || [];
  const idx = re => f.findIndex(x => re.test(String(x).trim()));
  const iCode = idx(/證券代號/), iName = idx(/證券名稱/);
  const iF = idx(/^外陸資買賣超|^外資買賣超/), iT = idx(/^投信買賣超/);
  let iD = idx(/^自營商買賣超股數$/); if (iD < 0) iD = idx(/^自營商買賣超/);
  const iTot = idx(/三大法人買賣超/);
  return (obj.data || []).map(r => ({
    code: String(r[iCode] || '').trim(), name: String(r[iName] || '').trim(),
    f: num(r[iF]), t: num(r[iT]), d: num(r[iD]), tot: num(r[iTot]),
  }));
}
function parseInstiRow(r) {
  // 上櫃 OpenAPI：欄位名稱可能中/英文，採模糊比對；單位：股
  const f = fnum(r, /(外資及陸資|外陸資|Foreign.*Investors?).*(買賣超|Diff|Net)/i, /^外資自營商|^Foreign ?Dealers?/i);
  const t = fnum(r, /(投信|Investment ?Trust).*(買賣超|Diff|Net)/i);
  let d = fnum(r, /^(自營商|Dealers?)(合計)?[-\s]?(買賣超|Diff|Net)/i);
  if (d == null) d = fnum(r, /^(自營商|Dealers?).*(買賣超|Diff|Net)/i, /自行|避險|Proprietary|Hedg/i);
  let tot = fnum(r, /(三大法人|Total).*(買賣超|Diff|Net)/i);
  if (tot == null && (f != null || t != null || d != null)) tot = (f || 0) + (t || 0) + (d || 0);
  return { f, t, d, tot };
}

function normalizeAll(raw, codes) {
  const set = new Set(codes);
  const stocks = {};
  const st = c => (stocks[c] ||= { code: c, news: [], routine: 0 });
  const each = (key, fn) => { const arr = raw[key]; if (Array.isArray(arr)) for (const r of arr) { const c = rowCode(r); if (c && set.has(c)) fn(st(c), r); } };
  const mk = key => key.endsWith('_O') ? '上櫃' : '上市';

  // 收盤價（同時判定市場別）
  for (const key of ['price_L', 'price_O']) each(key, (s, r) => {
    s.market = mk(key); s.name ||= rowName(r);
    s.price = { close: fnum(r, /^(ClosingPrice|Close|收盤價?)$/i), chg: fnum(r, /^(Change|漲跌(價差)?)$/i), vol: fnum(r, /^(TradeVolume|TradingShares|成交股數)$/i) };
  });
  for (const key of ['rev_L', 'rev_O']) each(key, (s, r) => {
    s.market ||= mk(key); s.name ||= rowName(r);
    s.rev = {
      ym: String(fval(r, /資料年月|年月/) || ''), rev: fnum(r, /當月營收/), mom: fnum(r, /上月比較增減/), yoy: fnum(r, /去年同月增減/),
      cum: fnum(r, /當月累計營收/), cumYoy: fnum(r, /前期比較增減/), note: String(fval(r, /備註/) || '').trim(),
    };
  });
  for (const key of ['eps_L', 'eps_O']) each(key, (s, r) => {
    s.name ||= rowName(r);
    s.eps = { y: String(fval(r, /^年度$|Year/i) || ''), q: String(fval(r, /^季別$|Season|Quarter/i) || ''), eps: fnum(r, /每股盈餘|EPS/i), rev: fnum(r, /^營業收入/), op: fnum(r, /^營業利益/), net: fnum(r, /稅後淨利|本期淨利/) };
  });
  for (const key of ['prof_L', 'prof_O']) each(key, (s, r) => {
    s.prof = { y: String(fval(r, /^年度$/) || ''), q: String(fval(r, /^季別$/) || ''), gm: fnum(r, /^毛利率/), om: fnum(r, /^營業利益率/), pm: fnum(r, /^稅後純益率|^稅後淨利率/) };
  });
  for (const key of ['div_L', 'div_O']) each(key, (s, r) => {
    let cash = 0, stock = 0;
    for (const k of Object.keys(r)) {
      if (!/元\/股/.test(k)) continue;
      const v = num(r[k]) || 0;
      if (/現金/.test(k)) cash += v; else if (/配股/.test(k)) stock += v;
    }
    const yr = String(fval(r, /所屬年|股利年度|^年度/) || '').trim();
    const period = String(fval(r, /所屬期間|期別/) || '').trim();
    const progress = String(fval(r, /決議|進度/) || '').trim();
    (s.divRows ||= []).push({ yr, period, cash: +cash.toFixed(4), stock: +stock.toFixed(4), progress });
  });
  for (const key of ['exdiv_L', 'exdiv_O']) each(key, (s, r) => {
    const d = normDate(fval(r, /^(Date|除權除息日期|除權息日期|除息交易日|除權息交易日|日期)$/i));
    const cash = fnum(r, /CashDividend|現金股利|息值/i);
    const type = String(fval(r, /^(Exdividend|除權息|權值\+息值|類別)$/i) || '').trim();
    if (!d) return;
    if (!s.exdiv || d < s.exdiv.date) s.exdiv = { date: d, cash, type };
  });
  for (const key of ['pe_L', 'pe_O']) each(key, (s, r) => {
    s.pe = { yld: fnum(r, /DividendYield|YieldRatio|殖利率/i), pe: fnum(r, /PEratio|PriceEarningRatio|本益比/i), pb: fnum(r, /PBratio|PriceBookRatio|股價淨值比/i) };
  });
  for (const key of ['credit_L', 'credit_O']) each(key, (s, r) => {
    s.credit = {
      m: fnum(r, /融資今日餘額|^資餘額|^融資餘額|MarginPurchase.*(Today|Balance)$/i, /前|限額|Prev|Yesterday/i),
      mPrev: fnum(r, /融資前日餘額|^前資餘額|MarginPurchase.*(Prev|Yesterday)/i),
      s: fnum(r, /融券今日餘額|^券餘額|^融券餘額|ShortSale.*(Today|Balance)$/i, /前|限額|Prev|Yesterday/i),
      sPrev: fnum(r, /融券前日餘額|^前券餘額|ShortSale.*(Prev|Yesterday)/i),
      limit: fnum(r, /融資限額|^資限額/),
    };
  });
  // 重大訊息
  for (const key of ['news_L', 'news_O']) each(key, (s, r) => {
    s.name ||= rowName(r);
    const subject = String(fval(r, /主旨|Subject/i) || '').trim();
    const desc = String(fval(r, /^說明|Description/i) || '').trim();
    const cat = classifyNews(subject, desc);
    const date = normDate(fval(r, /發言日期|^Date$/i)) || normDate(fval(r, /出表日期/));
    const n = { date, time: String(fval(r, /發言時間|Time/i) || ''), subject, clause: String(fval(r, /符合條款/) || '').trim(), fact: normDate(fval(r, /事實發生日/)), desc, cat };
    s.news.push(n);
  });
  // 股利：取最新年度合計（季配息加總）
  for (const s of Object.values(stocks)) {
    if (s.divRows?.length) {
      const years = s.divRows.map(x => x.yr).filter(Boolean).sort();
      const ly = years[years.length - 1] || '';
      const seen = new Set();
      const rows = (ly ? s.divRows.filter(x => x.yr === ly) : s.divRows).filter(x => { const k = `${x.yr}|${x.period}|${x.cash}|${x.stock}`; if (seen.has(k)) return false; seen.add(k); return true; });
      s.div = { yr: ly, cash: +rows.reduce((a, b) => a + b.cash, 0).toFixed(4), stock: +rows.reduce((a, b) => a + b.stock, 0).toFixed(4), n: rows.length, progress: rows[rows.length - 1]?.progress || '' };
      if (s.price?.close && s.div.cash) s.div.yldCalc = +(s.div.cash / s.price.close * 100).toFixed(2);
    }
    s.news.sort((a, b) => (b.date + b.time).localeCompare(a.date + a.time));
  }
  return stocks;
}

function parseTdccCsv(text, set) {
  // 欄位：資料日期,證券代號,持股分級,人數,股數,占集保庫存數比例%
  // 分級 12~15 = 400 張以上；15 = 1,000 張以上；17 = 合計
  const out = {}; let date = '';
  const lines = text.split(/\r?\n/);
  for (let i = 1; i < lines.length; i++) {
    const line = lines[i]; if (!line) continue;
    const c1 = line.indexOf(','), c2 = line.indexOf(',', c1 + 1);
    const code = line.slice(c1 + 1, c2).replace(/"/g, '').trim();
    if (!set.has(code)) continue;
    const cols = line.replace(/"/g, '').split(',');
    date ||= normDate(cols[0]);
    const lv = +cols[2], ppl = num(cols[3]), pct = num(cols[5]);
    const o = (out[code] ||= { p400: 0, p1000: 0, n400: 0, n1000: 0, nAll: 0 });
    if (lv >= 12 && lv <= 15) { o.p400 += pct || 0; o.n400 += ppl || 0; }
    if (lv === 15) { o.p1000 = pct || 0; o.n1000 = ppl || 0; }
    if (lv === 17) o.nAll = ppl || 0;
  }
  for (const o of Object.values(out)) { o.p400 = +o.p400.toFixed(2); o.p1000 = +o.p1000.toFixed(2); }
  return { date, map: out };
}

function apiBase() { return (S.settings.workerUrl || '').trim().replace(/\/+$/, ''); }
async function fetchDs(key, qs = '') {
  const base = apiBase();
  const r = await fetch(`${base}/api/${key}${qs}`, { cache: 'no-store' });
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  const meta = { src: r.headers.get('X-Source-Url') || '', dataDate: r.headers.get('X-Data-Date') || '', empty: r.headers.get('X-Empty') === '1' };
  const text = await r.text();
  if (key === 'tdcc') return { text, meta };
  const data = JSON.parse(text);
  return { data, meta };
}
function setProg(key, state, note = '') {

  const el = document.querySelector(`[data-ds="${key}"]`);
  if (el) {
    const i = $('i', el); i.className = state === 'ok' ? 'ok' : state === 'err' ? 'err' : state === 'empty' ? 'empty' : '';
    i.style.width = state === 'loading' ? '45%' : '100%';

  $('#topbar').style.width = state === 'idle' ? '0' : `${Math.round(done / DS.length * 100)}%`;

async function updateAll() {
  if (S.busy) return;
  if (!apiBase()) { toast('請先到「設定」填入 Worker 網址'); switchTab('settings'); return; }
  if (!S.holdings.length) { toast('請先到「名單管理」匯入持股'); switchTab('holdings'); return; }
  S.busy = true; renderAll();
  const codes = S.holdings.map(h => h.code);
  const set = new Set(codes);
  const raw = {}; let tdcc = null; let tradeDate = ''; const instiToday = {}; let instiODate = '';
  DS.forEach(([k]) => setProg(k, 'wait'));

  const queue = DS.map(([k]) => k);
  const worker = async () => {
    while (queue.length) {
      const key = queue.shift();
      setProg(key, 'loading');
      try {
        const res = await fetchDs(key);
        if (key === 'tdcc') {
          tdcc = parseTdccCsv(res.text, set);
          setProg(key, Object.keys(tdcc.map).length ? 'ok' : 'empty', `${Object.keys(tdcc.map).length} 檔`);
        } else if (key === 'insti_L') {
          const rows = Array.isArray(res.data) ? [] : parseT86(res.data);
          tradeDate = res.meta.dataDate || normDate(res.data?.date) || '';
          let n = 0; for (const r of rows) if (set.has(r.code)) { instiToday[r.code] = { f: r.f, t: r.t, d: r.d, tot: r.tot }; n++; }
          setProg(key, rows.length ? 'ok' : 'empty', `${n} 檔`);
        } else if (key === 'insti_O') {
          let n = 0;
          if (Array.isArray(res.data)) for (const r of res.data) {
            const c = rowCode(r); if (!c || !set.has(c)) continue;
            instiODate ||= normDate(fval(r, /^(Date|日期|資料日期)$/i));
            instiToday[c] = parseInstiRow(r); n++;
          }
          setProg(key, res.data?.length ? 'ok' : 'empty', `${n} 檔`);
        } else {
          raw[key] = Array.isArray(res.data) ? res.data : [];
          const n = raw[key].reduce((a, r) => a + (set.has(rowCode(r)) ? 1 : 0), 0);
          setProg(key, raw[key].length ? 'ok' : 'empty', `${n} 筆`);
        }
        S.sources[key].src = res.meta.src;
      } catch (e) {
        setProg(key, 'err', '失敗');
        S.sources[key].error = String(e.message || e);
      }
    }
  };
  await Promise.all([worker(), worker(), worker(), worker()]);

  // ---- 組合 ----
  const stocks = normalizeAll(raw, codes);
  const today = ymd(twNow());
  const dataDay = tradeDate || instiODate || today;
  if (Object.keys(instiToday).length) {
    S.hist.insti[dataDay] = { ...(S.hist.insti[dataDay] || {}), ...instiToday };
  }
  const creditSnap = {};
  for (const [c, s] of Object.entries(stocks)) if (s.credit?.m != null) creditSnap[c] = { m: s.credit.m, s: s.credit.s };
  if (Object.keys(creditSnap).length) S.hist.credit[dataDay] = creditSnap;
  if (tdcc?.date) S.hist.tdcc[tdcc.date] = tdcc.map;

  S.market = { updatedAt: Date.now(), tradeDate: dataDay, tdccDate: tdcc?.date || '', stocks };
  // 名稱回填
  for (const h of S.holdings) if (stocks[h.code]?.name) h.name = stocks[h.code].name;
  prune();
  await Promise.all([save.market(), save.hist(), save.holdings(), save.sources()]);
  renderAll();

  // ---- 上市三大法人歷史回補（判斷「連續賣超」用；TWSE 有頻率限制，逐日慢慢抓） ----
  if (tradeDate) await backfillInsti(tradeDate, set);

  S.busy = false; $('#topbar').style.width = '0';
  renderAll();
  toast('✅ 官方數據更新完成');
}

async function backfillInsti(latest, set) {
  const need = [];
  const d = new Date(Date.UTC(+latest.slice(0, 4), +latest.slice(4, 6) - 1, +latest.slice(6, 8)));
  for (let i = 1; i <= 12 && need.length < S.settings.backfillDays; i++) {
    const x = new Date(d); x.setUTCDate(d.getUTCDate() - i);
    const dow = x.getUTCDay(); if (dow === 0 || dow === 6) continue;
    const k = ymd(x);
    if (S.hist.insti[k] && Object.keys(S.hist.insti[k]).length) { need.push(null); continue; }
    if (S.hist.instiEmpty[k]) continue;
    need.push(k);
  }
  const todo = need.filter(Boolean);
  for (let i = 0; i < todo.length; i++) {
    const k = todo[i];
    $('#hdrSub').textContent = `回補上市法人歷史 ${prettyDate(k)}（${i + 1}/${todo.length}）`;
    try {
      const res = await fetchDs('insti_L', `?date=${k}`);
      const rows = Array.isArray(res.data) ? [] : parseT86(res.data);
      if (!rows.length) S.hist.instiEmpty[k] = 1;
      else { const m = {}; for (const r of rows) if (set.has(r.code)) m[r.code] = { f: r.f, t: r.t, d: r.d, tot: r.tot }; S.hist.insti[k] = { ...m, ...(S.hist.insti[k] || {}) }; }
      await save.hist();
    } catch { /* 下次再補 */ }
    await sleep(2500); // 避免觸發證交所頻率限制
  }
}

function prune() {
  const keep = (obj, n) => { const ks = Object.keys(obj).sort().reverse(); ks.slice(n).forEach(k => delete obj[k]); };
  keep(S.hist.insti, 30); keep(S.hist.tdcc, 16); keep(S.hist.credit, 20);
  const cut = ymd(new Date(Date.now() - 40 * 864e5));
  for (const k of Object.keys(S.hist.instiEmpty)) if (k < cut) delete S.hist.instiEmpty[k];
}

/* =========================================================
 *  異常偵測（兩層過濾：剔除例行公告 → 套用閾值）
 * ========================================================= */
function instiSeries(code) {
  // 注意：法人物件內的 d 是「自營商」，日期用 date
  return Object.keys(S.hist.insti).sort().reverse().map(day => ({ ...(S.hist.insti[day][code] || {}), date: day })).filter(x => x.tot != null);
}
function tdccSeries(code) {
  return Object.keys(S.hist.tdcc).sort().reverse().map(d => ({ d, ...(S.hist.tdcc[d][code] || {}) })).filter(x => x.p1000 != null);
}
function creditSeries(code) {
  return Object.keys(S.hist.credit).sort().reverse().map(d => ({ d, ...(S.hist.credit[d][code] || {}) })).filter(x => x.m != null);
}
function evaluate(code) {
  const s = S.market?.stocks?.[code] || {};
  const T = S.settings, out = [];
  const today = ymd(twNow());
  // 1) 重大訊息
  for (const n of s.news || []) {
    if (n.date && daysBetween(n.date, today) > T.newsDays) continue;
    if (n.cat === 'neg') out.push({ lv: 'red', k: 'news', t: `重訊：${n.subject.slice(0, 40)}` });
    else if (n.cat === 'pos') out.push({ lv: 'green', k: 'news', t: `重訊：${n.subject.slice(0, 40)}` });
    else if (n.cat === 'watch') out.push({ lv: 'yellow', k: 'news', t: `重訊：${n.subject.slice(0, 40)}` });
  }
  // 2) 月營收
  if (s.rev?.yoy != null) {
    if (s.rev.yoy <= T.revDown) out.push({ lv: 'red', k: 'rev', t: `營收 YoY ${fmt(s.rev.yoy, 1)}%` });
    else if (s.rev.yoy >= T.revUp) out.push({ lv: 'green', k: 'rev', t: `營收 YoY +${fmt(s.rev.yoy, 1)}%` });
  }
  // 3) EPS
  if (s.eps?.eps != null && s.eps.eps < 0) out.push({ lv: 'yellow', k: 'eps', t: `EPS ${fmt(s.eps.eps, 2)}（虧損）` });
  // 5) 法人連續買賣
  const ins = instiSeries(code);
  if (ins.length) {
    const dir = Math.sign(ins[0].tot); let cnt = 0, sum = 0;
    for (const x of ins) { if (Math.sign(x.tot) !== dir || dir === 0) break; cnt++; sum += x.tot; }
    const lots = Math.abs(sum) / 1000;
    if (cnt >= T.instiDays && lots >= T.instiLots) out.push({ lv: dir < 0 ? 'red' : 'green', k: 'insti', t: `法人連 ${cnt} 日${dir < 0 ? '賣超' : '買超'} ${fmt(lots)} 張` });
  }
  // 6) 融資融券
  const c = s.credit;
  if (c?.m != null && c.mPrev) {
    const chg = (c.m - c.mPrev) / c.mPrev * 100;
    if (chg >= T.creditJump && c.m - c.mPrev >= 50) out.push({ lv: 'yellow', k: 'credit', t: `融資單日 +${fmt(chg, 1)}%` });
    if (c.m > c.mPrev && c.s != null && c.sPrev != null && c.s > c.sPrev && (c.s - c.sPrev) >= 20) out.push({ lv: 'yellow', k: 'credit', t: '資券同增' });
  }
  // 7) 千張大戶
  const td = tdccSeries(code);
  if (td.length >= 2) {
    let downW = 0, upW = 0;
    for (let i = 0; i < td.length - 1; i++) { if (td[i].p1000 < td[i + 1].p1000) downW++; else break; }
    for (let i = 0; i < td.length - 1; i++) { if (td[i].p1000 > td[i + 1].p1000) upW++; else break; }
    if (downW >= T.bigWeeks) { const drop = td[downW].p1000 - td[0].p1000; if (drop >= T.bigDrop) out.push({ lv: 'red', k: 'big', t: `千張大戶連 ${downW} 週減 ${fmt(drop, 2)}pp` }); }
    if (upW >= T.bigWeeks) { const rise = td[0].p1000 - td[upW].p1000; if (rise >= T.bigDrop) out.push({ lv: 'green', k: 'big', t: `千張大戶連 ${upW} 週增 ${fmt(rise, 2)}pp` }); }
  }
  // 資訊標籤（不列入異常）
  const yld = s.pe?.yld ?? s.div?.yldCalc;
  if (yld != null && yld >= T.yieldHigh) out.push({ lv: 'info', k: 'yld', t: `殖利率 ${fmt(yld, 2)}%` });
  if (s.exdiv?.date && s.exdiv.date >= today && daysBetween(today, s.exdiv.date) <= 21) out.push({ lv: 'info', k: 'ex', t: `${prettyDate(s.exdiv.date).slice(5)} 除${s.exdiv.type || '權息'}` });
  return out;
}
const LV_ORDER = { red: 0, green: 1, yellow: 2, info: 3 };
function topLevel(al) { const a = al.filter(x => x.lv !== 'info'); if (!a.length) return null; return a.sort((x, y) => LV_ORDER[x.lv] - LV_ORDER[y.lv])[0].lv; }

/* =========================================================
 *  AI 查核員（Gemini / Claude，Key 只存在本機 localStorage）
 * ========================================================= */
const AI_SYS = `你是「台股持股官方資料查核員」，服務對象是以 200~300 檔零股長期分散配置的投資人。
嚴格規則：
1. 只能使用使用者訊息中提供的「官方一手資料 JSON」（來源：證交所、櫃買中心、公開資訊觀測站重大訊息、集保結算所）。
2. 禁止引用新聞、市場傳聞、你的記憶或任何未提供的數字；資料沒有的就寫進 missing，不得推測或腦補。
3. 每一條 evidence 必須引用資料中的具體數字、日期或重訊主旨原文。
4. 交叉比對：重訊內容是否與營收/EPS/三率/法人/融資/大戶籌碼相互印證或矛盾，要明確指出。
5. 給出行動分級（level）：
   - "red"：高風險警報（建議評估汰除零股）— 例如變更交易方法、重大虧損且營收大衰退、籌碼同步流出等
   - "green"：重大利多（基本面轉強／高息護盤，建議續抱或加碼）
   - "yellow"：中性觀察（短期波動，持續追蹤）
6. 這是風險分級輔助，不是投資建議；語氣客觀、精簡、繁體中文。
只輸出一個 JSON 物件，不要任何其他文字：
{"level":"red|green|yellow","label":"一句話標題(≤20字)","summary":"≤90字結論","evidence":["…"],"conflicts":["資料之間的矛盾，沒有就空陣列"],"missing":["缺少的關鍵資料"],"action":"給零股分散投資人的具體下一步(≤40字)"}`;

function buildFacts(code) {
  const s = S.market?.stocks?.[code] || {};
  const h = S.holdings.find(x => x.code === code) || {};
  const ins2 = instiSeries(code).slice(0, 10).map(x => ({ 日期: x.date, 外資張: r1(x.f), 投信張: r1(x.t), 自營商張: r1(x.d), 合計張: r1(x.tot) }));
  const td = tdccSeries(code).slice(0, 8).map(x => ({ 週: x.d, '400張以上持股%': x.p400, '1000張以上持股%': x.p1000, '1000張以上人數': x.n1000 }));
  const cr = creditSeries(code).slice(0, 5);
  return {
    股票: `${code} ${s.name || h.name || ''}`, 市場: s.market || '未知', 資料更新: S.market ? new Date(S.market.updatedAt).toLocaleString('zh-TW') : '',
    系統偵測異常: evaluate(code).map(x => x.t),
    持有: { 股數: h.shares, 均價: h.cost },
    收盤: s.price || null,
    月營收: s.rev ? { 年月: s.rev.ym, 當月營收千元: s.rev.rev, 'MoM%': s.rev.mom, 'YoY%': s.rev.yoy, '累計YoY%': s.rev.cumYoy, 備註: s.rev.note } : null,
    最新季EPS: s.eps || null,
    三率: s.prof ? { 年度: s.prof.y, 季別: s.prof.q, '毛利率%': s.prof.gm, '營益率%': s.prof.om, '稅後純益率%': s.prof.pm } : null,
    股利: s.div || null, 除權息預告: s.exdiv || null, 本益比殖利率: s.pe || null,
    三大法人近10日: ins2,
    融資融券: s.credit ? { 今日: s.credit, 近日歷史: cr } : null,
    集保大戶週變化: td,
    近期重大訊息: (s.news || []).filter(n => n.cat !== 'routine').slice(0, 6).map(n => ({ 日期: n.date, 主旨: n.subject, 符合條款: n.clause, 事實發生日: n.fact, 說明原文: n.desc.slice(0, 1500) })),
    已過濾例行公告數: (s.news || []).filter(n => n.cat === 'routine').length,
  };
}
function r1(v) { return v == null ? null : Math.round(v / 100) / 10; } // 股 → 張（一位小數）

async function callAI(userText) {
  const p = S.settings.aiProvider;
  if (p === 'claude') {
    const key = LS.get('key_claude'); if (!key) throw new Error('尚未設定 Claude API Key');
    const r = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'content-type': 'application/json', 'x-api-key': key, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' },
      body: JSON.stringify({ model: S.settings.claudeModel, max_tokens: 1500, temperature: 0.1, system: AI_SYS, messages: [{ role: 'user', content: userText }] }),
    });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j?.error?.message || `Claude HTTP ${r.status}`);
    return (j.content || []).map(x => x.text || '').join('');
  } else {
    const key = LS.get('key_gemini'); if (!key) throw new Error('尚未設定 Gemini API Key');
    const u = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(S.settings.geminiModel)}:generateContent?key=${encodeURIComponent(key)}`;
    const r = await fetch(u, {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ systemInstruction: { parts: [{ text: AI_SYS }] }, contents: [{ role: 'user', parts: [{ text: userText }] }], generationConfig: { temperature: 0.1, responseMimeType: 'application/json' } }),
    });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j?.error?.message || `Gemini HTTP ${r.status}`);
    return (j.candidates?.[0]?.content?.parts || []).map(x => x.text || '').join('');
  }
}
function parseAIJson(t) {
  t = String(t || '').replace(/```json|```/g, '').trim();
  const a = t.indexOf('{'), b = t.lastIndexOf('}');
  const o = JSON.parse(t.slice(a, b + 1));
  if (!['red', 'green', 'yellow'].includes(o.level)) o.level = 'yellow';
  return o;
}
async function aiCheck(code, silent) {
  if (S.aiBusy.has(code)) return;
  S.aiBusy.add(code); rerenderCurrent();
  try {
    const facts = buildFacts(code);
    const txt = await callAI(`請查核以下持股的官方一手資料，依規則輸出 JSON。\n\n${JSON.stringify(facts, null, 1)}`);
    S.ai[code] = { ...parseAIJson(txt), at: Date.now(), provider: S.settings.aiProvider };
    await save.ai();
  } catch (e) {
    if (!silent) toast('AI 查核失敗：' + (e.message || e), 4000);
    S.ai[code] = { error: String(e.message || e), at: Date.now() };
  } finally {
    S.aiBusy.delete(code); rerenderCurrent();
  }
}
async function aiCheckAll() {

}

function parseHoldings(text) {
  const ok = [], bad = [];
  const lines = String(text || '').replace(/^﻿/, '').split(/\r?\n/);
  lines.forEach((line, i) => {
    const raw = line.trim(); if (!raw) return;
    const cols = raw.replace(/[，\t;]/g, ',').replace(/"/g, '').split(',').map(x => x.trim()).filter((x, j) => x !== '' || j < 1);
    let code = (cols[0] || '').toUpperCase().replace(/\.(TW|TWO)$/, '').replace(/^TW/, '');
    if (!/^\d{4,6}[A-Z]?$/.test(code)) { if (i === 0 || /代號|代碼|code|symbol/i.test(raw)) return; bad.push(`第 ${i + 1} 行：${raw.slice(0, 30)}`); return; }
    let rest = cols.slice(1);
    let name = '';
    if (rest.length && num(rest[0]) == null) { name = rest[0]; rest = rest.slice(1); }
    ok.push({ code, name, shares: num(rest[0]) ?? 0, cost: num(rest[1]) ?? null });
  });
  // 同代號合併（股數相加、均價加權）
  const m = new Map();
  for (const h of ok) {
    const p = m.get(h.code);
    if (!p) m.set(h.code, { ...h });
    else { const tot = p.shares + h.shares; if (p.cost != null && h.cost != null && tot) p.cost = +((p.cost * p.shares + h.cost * h.shares) / tot).toFixed(2); p.shares = tot; p.name ||= h.name; }
  }
  return { list: [...m.values()], bad };
}
async function applyImport() {

}

async function importBackup(text) {

/* =========================================================
 *  集保 e 手掌握 PDF 匯入（pdf.js 於本機解析，檔案不上傳）
 * ========================================================= */
const PDFJS_VER = '4.10.38';
const PDFJS_BASE = `https://cdn.jsdelivr.net/npm/pdfjs-dist@${PDFJS_VER}`;
let _pdfjs = null;
async function loadPdfjs() {
  if (_pdfjs) return _pdfjs;
  const lib = await import(`${PDFJS_BASE}/build/pdf.min.mjs`);
  lib.GlobalWorkerOptions.workerSrc = `${PDFJS_BASE}/build/pdf.worker.min.mjs`;
  _pdfjs = lib;
  return lib;
}
async function pdfLines(file, password) {
  const lib = await loadPdfjs();
  const data = new Uint8Array(await file.arrayBuffer());
  const doc = await lib.getDocument({ data, password: password || undefined, cMapUrl: `${PDFJS_BASE}/cmaps/`, cMapPacked: true, standardFontDataUrl: `${PDFJS_BASE}/standard_fonts/` }).promise;
  const lines = [];
  for (let p = 1; p <= doc.numPages; p++) {
    const tc = await (await doc.getPage(p)).getTextContent();
    const rows = new Map();
    for (const it of tc.items) {
      const s = (it.str || '').trim(); if (!s) continue;
      const y = Math.round(it.transform[5] / 3);       // 同一列容許 ±3pt
      if (!rows.has(y)) rows.set(y, []);
      rows.get(y).push({ x: it.transform[4], w: it.width || 0, s });
    }
    [...rows.entries()].sort((a, b) => b[0] - a[0]).forEach(([, items]) => {
      items.sort((a, b) => a.x - b.x);
      lines.push({ page: p, items, text: items.map(i => i.s).join(' ') });
    });
  }
  return lines;
}
const TDCC_ROW = /(?:^|\s)(\d{4,6}[A-Z]?)\s+(\S+)\s+([\d,]+)\s+[\d,]+(?:\.\d+)?\s+\d{3,4}\/\d{1,2}\/\d{1,2}(?:\s|$)/;
function parseTdccPdf(lines) {
  // 只讀「庫存」區段；遇到「交易明細」區段就略過。股數欄位依表頭位置對齊。
  const out = []; let sect = 'inv'; let qtyX = null;
  const strict = lines.some(l => TDCC_ROW.test(l.text)); // 偵測到集保標準格式，就只採用標準格式的列
  for (const ln of lines) {
    const t = ln.text;
    if (/交易明細|異動明細/.test(t) && !/庫存/.test(t)) { sect = 'tx'; continue; }
    if (/庫存(明細|餘額)|餘額明細/.test(t)) { sect = 'inv'; }
    const hdr = ln.items.find(i => /(庫存|餘額|集保).{0,4}(股數|數量)|^(股數|數量|餘額|庫存股數|今日餘額|庫存數量)$/.test(i.s));
    if (hdr && /代號|名稱/.test(t)) { qtyX = hdr.x + hdr.w / 2; continue; }
    if (sect !== 'inv') continue;
    // 集保 e 手掌握實際格式：序號 代號 名稱 股數 參考價 日期 參考市值
    //   例：「2 1103 嘉泥 24 12.15 2026/11/23 291」
    const mm = t.match(TDCC_ROW);
    if (mm) {
      const shares = num(mm[3]);
      if (shares > 0) out.push({ code: mm[1], name: mm[2], shares: Math.round(shares), cost: null });
      continue;
    }
    if (strict) continue;
    // 備用：其他格式（代號可能和名稱黏在一起，例如「2330台積電」）
    const first = ln.items[0]?.s || '';
    const m = first.match(/^(\d{4,6}[A-Z]?)([^\d\/\-:.].*)?$/);
    if (!m) continue;
    let name = (m[2] || '').trim(); let rest = ln.items.slice(1);
    if (!name && rest.length && !/^[\d,.\-]+$/.test(rest[0].s)) { name = rest[0].s; rest = rest.slice(1); }
    const nums = rest.filter(i => /^-?[\d,]+(\.\d+)?$/.test(i.s)).map(i => ({ v: num(i.s), x: i.x + i.w / 2, int: !/\./.test(i.s) }));
    if (!nums.length) continue;
    let pick;
    if (qtyX != null) pick = nums.reduce((a, b) => Math.abs(b.x - qtyX) < Math.abs(a.x - qtyX) ? b : a);
    else pick = [...nums].reverse().find(n => n.int) || nums[nums.length - 1];
    if (pick?.v == null || pick.v <= 0) continue;
    out.push({ code: m[1], name, shares: Math.round(pick.v), cost: null });
  }
  return out;
}
async function importPdfs(files) {
  const st = $('#pdfStatus');
  const pw = ($('#pdfPw')?.value || '').trim().toUpperCase();
  st.innerHTML = '<div class="hint"><span class="spin"></span> 解析 PDF 中…</div>';
  const all = []; const logs = []; let sample = [];
  try { await loadPdfjs(); } catch (e) { st.innerHTML = `<div class="hint" style="color:var(--red)">PDF 解析元件載入失敗（需連網）：${esc(e.message)}</div>`; return; }
  for (const f of files) {
    try {
      const lines = await pdfLines(f, pw);
      const rows = parseTdccPdf(lines);
      all.push(...rows);
      logs.push(`✅ ${f.name}：${rows.length} 檔`);
      if (!sample.length || !rows.length) sample = lines.filter(l => /\d{4}/.test(l.text)).slice(0, 40).map(l => l.text);
    } catch (e) {
      const msg = e?.name === 'PasswordException' ? (pw ? '密碼錯誤' : '需要密碼（請填身分證字號）') : (e.message || String(e));
      logs.push(`❌ ${f.name}：${msg}`);
    }
  }
  // 相同代號（不同券商）加總股數
  const merged = parseHoldings(all.map(r => `${r.code},${(r.name || '').replace(/,/g, ' ')},${r.shares}`).join('\n'));
  st.innerHTML = `<div class="hint">${logs.map(esc).join('<br>')}</div>` +
    (sample.length ? `<details class="hint"><summary>股數不對或讀不到？點這裡看 PDF 原始文字，截圖給 Claude 調整</summary><pre style="white-space:pre-wrap;font-size:11px">${esc(sample.join('\n'))}</pre></details>` : '');
  if (merged.list.length) {
    S.ui.importPreview = merged; S.ui.importMode = 'merge';
    const keepPw = $('#pdfPw').value, keepSt = st.innerHTML;
    renderHoldings(); $('#pdfPw').value = keepPw; $('#pdfStatus').innerHTML = keepSt;
    toast(`讀到 ${merged.list.length} 檔，請確認後按「確認匯入」`);
  }
}

function sparkBars(vals) {
  if (!vals.length) return '<div class="faint small">尚無歷史資料（每次更新會自動累積）</div>';
  const v = [...vals].reverse(); const max = Math.max(...v.map(x => Math.abs(x.v)), 1);
  const w = 100 / v.length;
  return `<svg class="chart" viewBox="0 0 100 64" preserveAspectRatio="none">
    <line x1="0" y1="32" x2="100" y2="32" stroke="#263044" stroke-width=".4"/>
    ${v.map((x, i) => { const h = Math.abs(x.v) / max * 30; const y = x.v >= 0 ? 32 - h : 32; return `<rect x="${i * w + w * .15}" y="${y}" width="${w * .7}" height="${Math.max(h, .5)}" fill="${x.v >= 0 ? 'var(--up)' : 'var(--down)'}" rx=".6"/>`; }).join('')}
  </svg><div class="row between small faint"><span>${prettyDate(v[0].d).slice(5)}</span><span>${prettyDate(v[v.length - 1].d).slice(5)}</span></div>`;
}
function sparkLine(vals) {
  if (vals.length < 2) return `<div class="faint small">${vals.length ? '已有 1 週資料，下週起可看趨勢' : '尚無資料'}</div>`;
  const v = [...vals].reverse(); const mn = Math.min(...v.map(x => x.v)), mx = Math.max(...v.map(x => x.v)); const rg = mx - mn || 1;
  const pts = v.map((x, i) => `${i / (v.length - 1) * 100},${58 - (x.v - mn) / rg * 52}`).join(' ');
  return `<svg class="chart" viewBox="0 0 100 64" preserveAspectRatio="none"><polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="1.6" vector-effect="non-scaling-stroke"/></svg>

  let rows = S.holdings.map(h => {
    const s = S.market?.stocks?.[h.code] || {}; const al = S.market ? evaluate(h.code) : [];
    const td = tdccSeries(h.code);
    return { h, s, al, lv: topLevel(al), cnt: al.filter(a => a.lv !== 'info').length, yoy: s.rev?.yoy ?? null, big: td.length >= 2 ? +(td[0].p1000 - td[1].p1000).toFixed(2) : null, yld: s.pe?.yld ?? s.div?.yldCalc ?? null };
  });
  if (q) rows = rows.filter(r => r.h.code.toLowerCase().includes(q) || (r.s.name || r.h.name || '').toLowerCase().includes(q));
  const f = S.ui.filter;
  if (f === 'alert') rows = rows.filter(r => r.lv); else if (f === 'red') rows = rows.filter(r => r.lv === 'red');
  else if (f === 'L') rows = rows.filter(r => r.s.market === '上市'); else if (f === 'O') rows = rows.filter(r => r.s.market === '上櫃'); else if (f === 'nodata') rows = rows.filter(r => !r.s.market);
  const nz = v => v == null ? -Infinity : v;
  const sorters = {
    alerts: (a, b) => (LV_ORDER[a.lv] ?? 9) - (LV_ORDER[b.lv] ?? 9) || b.cnt - a.cnt || a.h.code.localeCompare(b.h.code),
    yoyDesc: (a, b) => nz(b.yoy) - nz(a.yoy), yoyAsc: (a, b) => (a.yoy ?? Infinity) - (b.yoy ?? Infinity),
    bigDesc: (a, b) => nz(b.big) - nz(a.big), bigAsc: (a, b) => (a.big ?? Infinity) - (b.big ?? Infinity),
    yld: (a, b) => nz(b.yld) - nz(a.yld), code: (a, b) => a.h.code.localeCompare(b.h.code),
  };
  rows.sort(sorters[S.ui.sort] || sorters.alerts);
  const metric = r => {
    switch (S.ui.sort) {
      case 'yoyDesc': case 'yoyAsc': return `<div class="small faint">營收YoY</div>${sgn(r.yoy)}`;
      case 'bigDesc': case 'bigAsc': return `<div class="small faint">千張週變</div>${sgn(r.big, 2, 'pp')}`;
      case 'yld': return `<div class="small faint">殖利率</div><b class="mono">${fmt(r.yld, 2)}%</b>`;
      default: return `<div class="small faint">收盤</div><b class="mono">${fmt(r.s.price?.close, 2)}</b>`;
    }
  };
  el.innerHTML = `
    <input id="q" type="search" placeholder="🔍 搜尋代號或名稱" value="${esc(S.ui.q)}" autocomplete="off" style="margin-bottom:10px">
    <div class="row" style="margin-bottom:10px">
      <select id="sort" class="grow">
        ${[['alerts', '依異常狀態'], ['yoyDesc', '營收年增率 高→低'], ['yoyAsc', '營收年增率 低→高'], ['bigDesc', '大戶持股週增 多→少'], ['bigAsc', '大戶持股週減 多→少'], ['yld', '殖利率 高→低'], ['code', '依代號']].map(([k, t]) => `<option value="${k}" ${S.ui.sort === k ? 'selected' : ''}>${t}</option>`).join('')}
      </select>
    </div>
    <div class="seg" style="margin-bottom:10px">
      ${[['all', '全部'], ['alert', '有異常'], ['red', '🔴 高風險'], ['L', '上市'], ['O', '上櫃'], ['nodata', '查無資料']].map(([k, t]) => `<button data-f="${k}" class="${f === k ? 'on' : ''}">${t}</button>`).join('')}
    </div>
    <div class="small faint" style="margin-bottom:4px">${rows.length} 檔 · 點擊展開明細</div>
    <div class="card list" style="padding:4px 12px">
      ${rows.map(r => `
        <div class="item" data-open="${r.h.code}">
          <div class="badge ${r.lv || 'none'}">${r.cnt || '·'}</div>
          <div class="grow">
            <div><span class="code" style="font-size:15px">${r.h.code}</span> <span class="nm">${esc(r.s.name || r.h.name || '')}</span></div>
            <div class="small faint" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${r.al.length ? r.al.map(a => esc(a.t)).join('・') : (r.s.market ? r.s.market + ' · 無異常' : (S.market ? '官方資料查無此代號' : '尚未更新'))}</div>
          </div>
          <div style="text-align:right">${metric(r)}</div>
        </div>
        ${S.ui.open === r.h.code ? renderDetail(r.h.code) : ''}`).join('') || '<div class="empty">沒有符合的持股</div>'}
    </div>`;
}

document.addEventListener('click', async e => {

  const go = e.target.closest('[data-go]'); if (go) { switchTab(go.dataset.go); return; }
  const af = e.target.closest('[data-af]'); if (af) { S.ui.alertFilter = af.dataset.af; renderAlerts(); return; }
  const fb = e.target.closest('[data-f]'); if (fb) { S.ui.filter = fb.dataset.f; renderRadar(); return; }
  const im = e.target.closest('[data-im]'); if (im) { S.ui.importMode = im.dataset.im; renderHoldings(); return; }
  const pv = e.target.closest('[data-prov]'); if (pv) { S.settings.aiProvider = pv.dataset.prov; await save.settings(); renderSettings(); return; }
  const btn = e.target.closest('[data-act]');
  if (btn) {
    const a = btn.dataset.act, code = btn.dataset.code;
    if (a === 'update') updateAll();
    else if (a === 'ai') aiCheck(code);
    else if (a === 'aiall') aiCheckAll();
    else if (a === 'pickcsv') $('#fileCsv').click();
    else if (a === 'pickjson') $('#fileJson').click();
    else if (a === 'pickpdf') $('#filePdf').click();
    else if (a === 'parse') { S.ui.importPreview = parseHoldings($('#csvText').value); if (!S.ui.importPreview.list.length) toast('沒有解析到任何持股'); const keep = $('#csvText').value; renderHoldings(); $('#csvText').value = keep; }
    else if (a === 'apply') applyImport();
    else if (a === 'export') exportBackup();
    else if (a === 'delh') { S.holdings = S.holdings.filter(h => h.code !== code); await save.holdings(); renderAll(); }
    else if (a === 'clearh') { if (confirm('確定清空所有持股？（建議先匯出備份）')) { S.holdings = []; await save.holdings(); renderAll(); } }
    else if (a === 'color') { S.settings.colorIntl = !S.settings.colorIntl; await save.settings(); renderAll(); }
    else if (a === 'resetth') { for (const k of Object.keys(DEFAULTS)) if (!['workerUrl', 'aiProvider', 'geminiModel', 'claudeModel', 'colorIntl'].includes(k)) S.settings[k] = DEFAULTS[k]; await save.settings(); renderAll(); toast('已恢復預設閾值'); }
    else if (a === 'clearai') { S.ai = {}; await save.ai(); renderAll(); toast('已清除'); }
    else if (a === 'clearhist') { if (confirm('清除法人／融資／大戶歷史？連續性判斷需重新累積。')) { S.hist = { insti: {}, instiEmpty: {}, tdcc: {}, credit: {} }; await save.hist(); renderAll(); } }
    else if (a === 'wipe') { if (confirm('刪除所有本機資料（持股、設定、歷史、AI 結果）？API Key 也會清除。')) { await DB.clear(); try { localStorage.clear(); } catch { } location.reload(); } }
    else if (a === 'probe') probe();
    return;
  }
  const op = e.target.closest('[data-open]');
  if (op) { S.ui.open = S.ui.open === op.dataset.open ? null : op.dataset.open; if (S.ui.tab !== 'radar') { switchTab('radar'); setTimeout(() => document.querySelector(`.item[data-open="${S.ui.open}"]`)?.scrollIntoView({ block: 'start' }), 30); } else renderRadar(); }
});

  else if (t.id === 'filePdf' && t.files.length) { await importPdfs([...t.files]); t.value = ''; }
  else if (t.id === 'fileJson' && t.files[0]) { try { await importBackup(await t.files[0].text()); } catch (err) { toast('還原失敗：' + err.message, 3500); } t.value = ''; }

async function readFileText(file) {
  // 券商 CSV 常為 Big5：先試 UTF-8，出現亂碼再改用 Big5
  const buf = await file.arrayBuffer();
  let txt = new TextDecoder('utf-8').decode(buf);
  if (txt.includes('�')) { try { txt = new TextDecoder('big5').decode(buf); } catch { } }
  return txt;
}
async function probe() {
  if (!apiBase()) { toast('請先填 Worker 網址'); return; }
  const out = $('#probeOut'); out.innerHTML = '<div class="hint"><span class="spin"></span> 逐一測試官方端點（約 10~30 秒）…</div>';
  try {
    const r = await fetch(apiBase() + '/api/probe', { cache: 'no-store' }); const j = await r.json();
    out.innerHTML = `<table style="margin-top:8px"><tbody>${Object.entries(j).map(([k, v]) => `<tr><td class="small">${v.ok ? '✅' : '❌'} ${esc(v.label)}</td><td class="r small faint">${v.ok ? fmt(v.bytes / 1024) + 'KB' : '不可用'}</td></tr>${v.ok ? '' : `<tr><td colspan="2" class="small faint" style="word-break:break-all">試過：${esc((v.tried || []).join(' , '))}</td></tr>`}`).join('')}</tbody></table>
      <div class="hint">❌ 代表官方暫無資料或路徑已變更，可在 worker.js 的 DATASETS 補上新路徑。</div>`;
  } catch (e) { out.innerHTML = `<div class="hint" style="color:var(--red)">連不到 Worker：${esc(e.message)}</div>`; }
}

/* =========================================================
 *  自動偵測新版本（打開 App、切回 App、每 5 分鐘檢查一次）
 * ========================================================= */
async function checkUpdate() {
  if (!navigator.onLine) return;
  try {
    const r = await fetch(`index.html?check=${Date.now()}`, { cache: 'no-store' });
    if (!r.ok) return;
    const m = (await r.text()).match(/APP_VERSION = '([^']+)'/);
    if (m && m[1] !== APP_VERSION) $('#updBar').classList.add('show');
  } catch { }
}
async function applyUpdate() {
  $('#updBar').innerHTML = '<span class="spin"></span> 更新中…';
  try {
    const reg = await navigator.serviceWorker?.getRegistration();
    await reg?.update();
    const keys = await caches.keys(); await Promise.all(keys.map(k => caches.delete(k)));
  } catch { }
  location.reload();
}
document.addEventListener('click', e => { if (e.target.closest('#updBar')) applyUpdate(); });

 *  啟動
 * ========================================================= */
(async () => {
  try { await load(); } catch (e) { toast('本機資料庫開啟失敗：' + e.message, 5000); }
  if (!navigator.onLine) $('#offline').style.display = 'block';
  $('#main').addEventListener('scroll', () => document.body.classList.toggle('scrolled', $('#main').scrollTop > 34), { passive: true });
  renderAll();
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => { });
  checkUpdate();
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') checkUpdate(); });
  setInterval(checkUpdate, 5 * 60 * 1000);
  if (navigator.storage?.persist) navigator.storage.persist().catch(() => { });
})();
</script>
</body>
</html>
