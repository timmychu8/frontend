    </div>`;
}

function renderAll() { invalidate(); applyColor(); renderHeader(); rerenderCurrent(); }
function rerenderCurrent() {
  const t = S.ui.tab;
  const keepScroll = window.scrollY;
  if (t === 'alerts') renderAlerts(); else if (t === 'radar') renderRadar(); else if (t === 'calendar') renderCalendar(); else if (t === 'holdings') renderHoldings(); else renderSettings();
  window.scrollTo(0, keepScroll);
  hookSentinel();
}
const LIM0 = { alerts: 25, radar: 80, holdings: 100 };
function resetLim(k) { S.ui.lim[k] = LIM0[k]; }
const _io = 'IntersectionObserver' in window ? new IntersectionObserver(es => {
  for (const e of es) if (e.isIntersecting) { _io.unobserve(e.target); const k = e.target.dataset.more; S.ui.lim[k] += LIM0[k]; rerenderCurrent(); }
}, { rootMargin: '900px 0px' }) : null;
function hookSentinel() { const s = document.querySelector('section.on .sentinel'); if (s && _io) _io.observe(s); }
function sentinel(k, remain) { return remain > 0 ? `<button class="sentinel btn full" data-more="${k}" data-act="more">再載入 ${Math.min(remain, LIM0[k])} 檔（尚有 ${remain} 檔）</button>` : ''; }
const TITLES = { alerts: '異常警報', radar: '持股雷達', calendar: '股息日曆', holdings: '名單管理', settings: '設定' };
function switchTab(t) {
  S.ui.tab = t; if (t in LIM0) resetLim(t);
  $('#bigTitle').textContent = $('#miniTitle').textContent = TITLES[t];
  $('#navPill').style.transform = `translateX(${Object.keys(TITLES).indexOf(t) * 100}%)`;
  $$('nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === t));
  $$('main section').forEach(s => s.classList.toggle('on', s.id === 'tab-' + t));
  rerenderCurrent(); window.scrollTo(0, 0); document.body.classList.remove('scrolled');
}
function applyColor() { document.body.classList.toggle('intl', !!S.settings.colorIntl); document.body.classList.toggle('privacy', !!S.settings.privacy); }

/* =========================================================
 *  事件
 * ========================================================= */
document.addEventListener('click', async e => {
  if (e.target.closest('header') && !e.target.closest('#privBtn') && document.body.classList.contains('scrolled')) { window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
  const g = e.target.closest('[data-gl]'); if (g) { e.stopPropagation(); openGloss(g.dataset.gl); return; }
  const nb = e.target.closest('nav button'); if (nb) { switchTab(nb.dataset.tab); return; }
  const go = e.target.closest('[data-go]'); if (go) { switchTab(go.dataset.go); return; }
  const af = e.target.closest('[data-af]'); if (af) { S.ui.alertFilter = af.dataset.af; S.ui.stagger = true; resetLim('alerts'); renderAlerts(); hookSentinel(); return; }
  const fb = e.target.closest('[data-f]'); if (fb) { S.ui.filter = fb.dataset.f; resetLim('radar'); renderRadar(); hookSentinel(); return; }
  const im = e.target.closest('[data-im]'); if (im) { S.ui.importMode = im.dataset.im; renderHoldings(); return; }
  const pv = e.target.closest('[data-prov]'); if (pv) { S.settings.aiProvider = pv.dataset.prov; await save.settings(); renderSettings(); return; }
  const btn = e.target.closest('[data-act]');
  if (btn) {
    const a = btn.dataset.act, code = btn.dataset.code;
    if (a === 'closesheet') { $('#sheet').classList.remove('show'); return; }
    if (a === 'privacy') { S.settings.privacy = !S.settings.privacy; await save.settings(); applyColor(); toast(S.settings.privacy ? '隱私模式：金額已隱藏' : '已顯示金額', 1400); return; }
    if (a === 'ics') { addToCalendar(); return; }
    if (a === 'family') { shareFamily(); return; }
    if (a === 'editcost') {
      const hd = S.holdings.find(x => x.code === code); if (!hd) return;
      const v = prompt(`${code} ${nameOf(code)}\n請輸入你的平均成本價（每股，元）；留空表示清除：`, hd.cost ?? '');
      if (v === null) return;
      hd.cost = v.trim() === '' ? null : num(v); await save.holdings(); renderAll(); toast('已更新成本價', 1200); return;
    }
    if (a === 'more') { const k = btn.dataset.more; S.ui.lim[k] += LIM0[k]; rerenderCurrent(); }
    else if (a === 'update') updateAll();
    else if (a === 'ai') aiCheck(code);
    else if (a === 'aiall') aiCheckAll();
    else if (a === 'pickcsv') $('#fileCsv').click();
    else if (a === 'pickjson') $('#fileJson').click();
    else if (a === 'pickpdf') $('#filePdf').click();
    else if (a === 'parse') { S.ui.importPreview = parseHoldings($('#csvText').value); if (!S.ui.importPreview.list.length) toast('沒有解析到任何持股'); const keep = $('#csvText').value; renderHoldings(); $('#csvText').value = keep; }
    else if (a === 'apply') applyImport();
    else if (a === 'export') exportBackup();
    else if (a === 'delh') { S.holdings = S.holdings.filter(h => h.code !== code); await save.holdings(); renderAll(); }
    else if (a === 'clearh') { if (confirm('確定清空所有持股？（建議先匯出備份）')) { S.holdings = []; await save.holdings(); renderAll(); } }
    else if (a === 'autoupd') { S.settings.autoUpdate = !S.settings.autoUpdate; await save.settings(); renderSettings(); }
    else if (a === 'color') { S.settings.colorIntl = !S.settings.colorIntl; await save.settings(); renderAll(); }
    else if (a === 'resetth') { for (const k of Object.keys(DEFAULTS)) if (!['workerUrl', 'aiProvider', 'geminiModel', 'claudeModel', 'colorIntl'].includes(k)) S.settings[k] = DEFAULTS[k]; await save.settings(); renderAll(); toast('已恢復預設閾值'); }
    else if (a === 'clearai') { S.ai = {}; await save.ai(); renderAll(); toast('已清除'); }
    else if (a === 'clearhist') { if (confirm('清除法人／融資／大戶歷史？連續性判斷需重新累積。')) { S.hist = { insti: {}, instiEmpty: {}, tdcc: {}, credit: {}, price: {} }; await save.hist(); renderAll(); } }
    else if (a === 'wipe') { if (confirm('刪除所有本機資料（持股、設定、歷史、AI 結果）？API Key 也會清除。')) { await DB.clear(); try { localStorage.clear(); } catch { } location.reload(); } }
    else if (a === 'probe') probe();
    return;
  }
  const op = e.target.closest('[data-open]');
  if (op) { S.ui.open = S.ui.open === op.dataset.open ? null : op.dataset.open; if (S.ui.tab !== 'radar') { switchTab('radar'); setTimeout(() => document.querySelector(`.item[data-open="${S.ui.open}"]`)?.scrollIntoView({ block: 'start' }), 30); } else renderRadar(); }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'q') { S.ui.q = t.value; clearTimeout(window._qT); window._qT = setTimeout(() => { const pos = $('#q').selectionStart; resetLim('radar'); renderRadar(); hookSentinel(); const n = $('#q'); n.focus(); n.setSelectionRange(pos, pos); }, 150); }
});
document.addEventListener('change', async e => {
  const t = e.target;
  if (t.id === 'sort') { S.ui.sort = t.value; resetLim('radar'); renderRadar(); hookSentinel(); }
  else if (t.dataset.set) { const k = t.dataset.set; S.settings[k] = t.type === 'number' ? (num(t.value) ?? DEFAULTS[k]) : t.value.trim(); await save.settings(); invalidate(); renderHeader(); toast('已儲存', 1000); }
  else if (t.dataset.key) { LS.set(t.dataset.key, t.value.trim()); toast('API Key 已存於本機', 1200); }
  else if (t.id === 'fileCsv' && t.files[0]) { const txt = await readFileText(t.files[0]); $('#csvText').value = txt; S.ui.importPreview = parseHoldings(txt); renderHoldings(); $('#csvText').value = txt; t.value = ''; }
  else if (t.id === 'filePdf' && t.files.length) { await importPdfs([...t.files]); t.value = ''; }
  else if (t.id === 'fileJson' && t.files[0]) { try { await importBackup(await t.files[0].text()); } catch (err) { toast('還原失敗：' + err.message, 3500); } t.value = ''; }
});
async function readFileText(file) {
  // 券商 CSV 常為 Big5：先試 UTF-8，出現亂碼再改用 Big5
  const buf = await file.arrayBuffer();
  let txt = new TextDecoder('utf-8').decode(buf);
  if (txt.includes('�')) { try { txt = new TextDecoder('big5').decode(buf); } catch { } }
  return txt;
}
async function probe() {
  if (!apiBase()) { toast('請先填 Worker 網址'); return; }
  const out = $('#probeOut'); out.innerHTML = '<div class="hint"><span class="spin"></span> 逐一測試官方端點（約 10~30 秒）…</div>';
  try {
    const r = await fetch(apiBase() + '/api/probe', { cache: 'no-store' }); const j = await r.json();
    out.innerHTML = `<table style="margin-top:8px"><tbody>${Object.entries(j).map(([k, v]) => `<tr><td class="small">${v.ok ? '✅' : '❌'} ${esc(v.label)}</td><td class="r small faint">${v.ok ? fmt(v.bytes / 1024) + 'KB' : '不可用'}</td></tr>${v.ok ? '' : `<tr><td colspan="2" class="small faint" style="word-break:break-all">試過：${esc((v.tried || []).join(' , '))}</td></tr>`}`).join('')}</tbody></table>
      <div class="hint">❌ 代表官方暫無資料或路徑已變更，可在 worker.js 的 DATASETS 補上新路徑。</div>`;
  } catch (e) { out.innerHTML = `<div class="hint" style="color:var(--red)">連不到 Worker：${esc(e.message)}</div>`; }
}
let _scrubEl = null;
document.addEventListener('pointerdown', e => { const w = e.target.closest('.chart-wrap'); if (w) { _scrubEl = w; scrub(w, e.clientX); } });
document.addEventListener('pointermove', e => { if (_scrubEl) scrub(_scrubEl, e.clientX); });
['pointerup', 'pointercancel'].forEach(t => document.addEventListener(t, () => { _scrubEl = null; }));
window.addEventListener('online', () => $('#offline').style.display = 'none');
window.addEventListener('offline', () => $('#offline').style.display = 'block');

/* =========================================================
 *  自動偵測新版本（打開 App、切回 App、每 5 分鐘檢查一次）
 * ========================================================= */
async function checkUpdate() {
  if (!navigator.onLine) return;
  try {
    const r = await fetch(`index.html?check=${Date.now()}`, { cache: 'no-store' });
    if (!r.ok) return;
    const m = (await r.text()).match(/APP_VERSION = '([^']+)'/);
    if (m && m[1] !== APP_VERSION) $('#updBar').classList.add('show');
  } catch { }
}
async function applyUpdate() {
  $('#updBar').innerHTML = '<span class="spin"></span> 更新中…';
  try {
    const reg = await navigator.serviceWorker?.getRegistration();
    await reg?.update();
    const keys = await caches.keys(); await Promise.all(keys.map(k => caches.delete(k)));
  } catch { }
  location.reload();
}
document.addEventListener('click', e => { if (e.target.closest('#updBar')) applyUpdate(); });
/* =========================================================
 *  啟動
 * ========================================================= */
(async () => {
  try { await load(); } catch (e) { toast('本機資料庫開啟失敗：' + e.message, 5000); }
  if (!navigator.onLine) $('#offline').style.display = 'block';
  window.addEventListener('scroll', () => document.body.classList.toggle('scrolled', window.scrollY > 34), { passive: true });
  renderAll();
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => { });
  checkUpdate();
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { checkUpdate(); autoUpdateIfDue(); } });
  setTimeout(autoUpdateIfDue, 800);
  setInterval(checkUpdate, 5 * 60 * 1000);
  if (navigator.storage?.persist) navigator.storage.persist().catch(() => { });
})();
</script>
