<style>
/* ===== Apple 風格：乾淨深色 + Liquid Glass（只用在標題列、分頁列、卡片） ===== */
:root{
  --bgc:#000; --tx:#f5f5f7; --tx2:rgba(235,235,245,.62); --tx3:rgba(235,235,245,.38);
  --card:rgba(255,255,255,.065); --card2:rgba(255,255,255,.10); --bg2:rgba(255,255,255,.045);
  --stroke:rgba(255,255,255,.10); --stroke2:rgba(255,255,255,.16); --line:rgba(255,255,255,.08);
  --hl:inset 0 .5px 0 rgba(255,255,255,.14);
  --glass:blur(24px) saturate(180%);
  /* Apple 系統色 */
  --accent:#0a84ff; --red:#ff453a; --green:#30d158; --yellow:#ffd60a; --purple:#bf5af2;
  --red-bg:rgba(255,69,58,.15); --green-bg:rgba(48,209,88,.14); --yellow-bg:rgba(255,214,10,.13); --blue-bg:rgba(10,132,255,.15);
  --up:#ff453a; --down:#30d158;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
  --bar-h:46px; --nav-h:64px; --nav-bottom:max(10px, calc(var(--sab) - 10px));
}
body.intl{ --up:#30d158; --down:#ff453a; }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bgc);min-height:100%}
body{margin:0;min-height:100vh;min-height:100dvh;background:var(--bgc);color:var(--tx);
  font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang TC","Noto Sans TC",sans-serif;
  -webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
/* 頂部一點點冷色調，讓玻璃有層次但不搶眼 */
.bg{position:fixed;left:0;right:0;top:0;height:60vh;z-index:0;pointer-events:none;
  background:radial-gradient(120% 70% at 50% -10%, rgba(10,132,255,.16), rgba(10,132,255,0) 70%)}
.bg i{display:none}

/* ---------- 上方玻璃標題列（往下滑才出現） ---------- */
header{position:fixed;top:0;left:0;right:0;z-index:30;padding-top:var(--sat);pointer-events:none}
header::before{content:'';position:absolute;inset:0;background:rgba(18,18,22,.6);
  -webkit-backdrop-filter:var(--glass);backdrop-filter:var(--glass);border-bottom:.5px solid var(--stroke);opacity:0;transition:opacity .25s}
body.scrolled header::before{opacity:1}
header .bar{position:relative;height:var(--bar-h);display:flex;align-items:center;justify-content:center;padding:0 calc(var(--sar) + 16px) 0 calc(var(--sal) + 16px)}
#miniTitle{font-size:17px;font-weight:600;opacity:0;transform:translateY(6px);transition:.25s}
body.scrolled #miniTitle{opacity:1;transform:none}
#hdrCount{position:absolute;right:calc(var(--sar) + 16px);pointer-events:auto}
#topbar{position:absolute;left:0;bottom:-.5px;height:2px;width:0;background:var(--accent);transition:width .3s}

/* ---------- 內容：整頁原生捲動（避免 Safari 高度計算錯誤） ---------- */
main{position:relative;z-index:10;
  padding:calc(var(--sat) + var(--bar-h)) calc(var(--sar) + 16px) calc(var(--nav-bottom) + var(--nav-h) + 28px) calc(var(--sal) + 16px)}
.large{margin:0 2px 18px}
.large h1{margin:0;font-size:34px;line-height:1.15;font-weight:700;letter-spacing:.2px}
.large .sub{margin-top:4px;font-size:13.5px;color:var(--tx2)}

/* ---------- 懸浮膠囊分頁列（Liquid Glass） ---------- */
nav{position:fixed;z-index:30;left:calc(var(--sal) + 16px);right:calc(var(--sar) + 16px);bottom:var(--nav-bottom);
  height:var(--nav-h);border-radius:999px;display:flex;padding:4px;
  background:rgba(30,30,34,.55);-webkit-backdrop-filter:blur(28px) saturate(180%);backdrop-filter:blur(28px) saturate(180%);
  border:.5px solid var(--stroke2);box-shadow:var(--hl),0 8px 30px rgba(0,0,0,.45)}
#navPill{position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px) / 5);border-radius:999px;
  background:rgba(255,255,255,.12);box-shadow:inset 0 .5px 0 rgba(255,255,255,.22);transition:transform .35s cubic-bezier(.3,1.25,.5,1)}
nav button{position:relative;z-index:1;flex:1;min-width:0;background:none;border:0;color:var(--tx3);font:inherit;font-size:10px;white-space:nowrap;font-weight:600;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:0;transition:color .2s}
nav button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--accent)}
nav .dot{position:absolute;top:3px;left:calc(50% + 6px);min-width:18px;height:18px;border-radius:9px;background:var(--red);color:#fff;font-size:10.5px;font-weight:700;
  display:flex;align-items:center;justify-content:center;padding:0 5px}

/* ---------- 元件 ---------- */
section{display:none} section.on{display:block}
.card{background:var(--card);border:.5px solid var(--stroke);border-radius:22px;padding:16px;margin-bottom:12px;box-shadow:var(--hl)}
/* 長清單：畫面外的卡片不渲染，捲動更順 */
.alert{content-visibility:auto;contain-intrinsic-size:auto 190px}
.list .item{content-visibility:auto;contain-intrinsic-size:auto 62px}
.card h3{margin:0 0 10px;font-size:17px;font-weight:600}
.muted{color:var(--tx2)} .faint{color:var(--tx3)} .small{font-size:12.5px} .mono{font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:8px} .between{justify-content:space-between} .wrap{flex-wrap:wrap} .grow{flex:1;min-width:0}
.btn{appearance:none;border:0;background:rgba(255,255,255,.10);color:var(--tx);border-radius:14px;padding:11px 14px;
  font:inherit;font-size:15px;font-weight:600;min-height:46px;box-shadow:var(--hl);transition:transform .12s,opacity .12s}
.btn:active{transform:scale(.97);opacity:.8}
.btn.pri{background:var(--accent);color:#fff;box-shadow:none}
.btn.ai{background:rgba(191,90,242,.18);color:#d9a6ff;box-shadow:inset 0 0 0 .5px rgba(191,90,242,.35)}
.btn.danger{color:var(--red)}
.btn.sm{padding:6px 12px;min-height:32px;font-size:13px;border-radius:999px}
.btn[disabled]{opacity:.4}
.full{width:100%}
input,select,textarea{font:inherit;font-size:16px;color:var(--tx);background:rgba(118,118,128,.20);border:0;border-radius:12px;
  padding:12px 14px;width:100%;outline:none;-webkit-appearance:none;appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,var(--tx2) 50%),linear-gradient(135deg,var(--tx2) 50%,transparent 50%);
  background-position:calc(100% - 20px) 52%,calc(100% - 14px) 52%;background-size:6px 6px;background-repeat:no-repeat;padding-right:36px}
input[type=search]{border-radius:12px}
input:focus,select:focus,textarea:focus{box-shadow:0 0 0 2px rgba(10,132,255,.6)}
textarea{min-height:130px;font-family:ui-monospace,Menlo,monospace;font-size:14px}
label.f{display:block;font-size:13px;color:var(--tx2);margin:12px 0 6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--card);border:.5px solid var(--stroke);border-radius:18px;padding:12px 4px;text-align:center;box-shadow:var(--hl);font:inherit;color:inherit;width:100%;transition:background .15s,border-color .15s}
button.stat:active{transform:scale(.97)}
.stat.on{background:rgba(255,255,255,.13);border-color:rgba(255,255,255,.32)}
.dist{display:flex;gap:2px;height:8px;border-radius:4px;overflow:hidden}
.dist i{display:block;height:100%}
.facts{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;margin-top:12px;font-size:13px;color:var(--tx2)}
.facts b{color:var(--tx);font-weight:600;font-variant-numeric:tabular-nums}
.facts .go{margin-left:auto;color:var(--accent)}
.sentinel{margin:4px 0 12px;color:var(--tx2)}
.stat b{display:block;font-size:26px;line-height:1.1;font-weight:700;font-variant-numeric:tabular-nums}
.stat span{font-size:11.5px;color:var(--tx2)}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:600;line-height:1.4;
  background:rgba(255,255,255,.08);color:var(--tx2)}
.chip.red{background:var(--red-bg);color:var(--red)} .chip.green{background:var(--green-bg);color:var(--green)}
.chip.yellow{background:var(--yellow-bg);color:var(--yellow)} .chip.info{background:var(--blue-bg);color:#64b0ff}
#hdrCount{background:rgba(255,255,255,.10);color:var(--tx);-webkit-backdrop-filter:var(--glass);backdrop-filter:var(--glass)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.seg{display:flex;gap:6px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none} .seg::-webkit-scrollbar{display:none}
.seg button{flex:none;border:0;background:rgba(118,118,128,.20);color:var(--tx2);border-radius:999px;padding:7px 14px;font:inherit;font-size:13.5px;font-weight:600}
.seg button.on{background:var(--tx);color:#000}
.alert{position:relative;overflow:hidden}
.alert::before{content:'';position:absolute;left:0;top:16px;bottom:16px;width:3px;border-radius:0 3px 3px 0;background:var(--line)}
.alert.red::before{background:var(--red)} .alert.green::before{background:var(--green)} .alert.yellow::before{background:var(--yellow)}
.code{font-weight:700;font-size:17px;font-variant-numeric:tabular-nums} .nm{font-weight:600}
.verdict{margin-top:12px;border-radius:14px;padding:12px 14px;font-size:14px}
.verdict.red{background:var(--red-bg)} .verdict.green{background:var(--green-bg)} .verdict.yellow{background:var(--yellow-bg)}
.verdict.err{background:rgba(255,255,255,.06);color:var(--tx2)}
.vh{display:flex;align-items:center;gap:8px;margin-bottom:4px;font-size:15px}
.vtag{flex:none;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px;background:rgba(0,0,0,.25)}
.verdict.red .vtag{color:var(--red)} .verdict.green .vtag{color:var(--green)} .verdict.yellow .vtag{color:var(--yellow)}
.vs{color:var(--tx);line-height:1.55}
.va{margin-top:6px;font-weight:600}
.verdict details summary{margin-top:8px;color:var(--accent);font-size:13px;font-weight:600;list-style:none;cursor:pointer}
.verdict details summary::-webkit-details-marker{display:none}
.vm{margin-top:8px;font-size:11.5px;color:var(--tx3)}
.verdict ul{margin:4px 0 0;padding-left:18px} .verdict li{margin:2px 0}
.list .item{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:.5px solid var(--line)}
.list .item:last-child{border-bottom:0}
.badge{min-width:26px;height:26px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:700;flex:none}
.badge.red{background:var(--red);color:#fff} .badge.green{background:var(--green);color:#002a10}
.badge.yellow{background:var(--yellow);color:#3a2e00} .badge.none{background:rgba(255,255,255,.08);color:var(--tx3)}
.up{color:var(--up)} .down{color:var(--down)}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kv div{background:var(--bg2);border-radius:12px;padding:9px 10px}
.kv small{display:block;color:var(--tx3);font-size:11.5px} .kv b{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.detail{background:rgba(255,255,255,.035);border-radius:18px;padding:14px;margin:2px 0 12px}
.detail h5{margin:16px 0 8px;font-size:13px;color:var(--tx2);font-weight:600}
.detail h5:first-child{margin-top:0}
.news{background:var(--bg2);border-radius:12px;padding:10px 12px;margin-bottom:6px;font-size:13.5px}
.news details summary{list-style:none;cursor:pointer} .news details summary::-webkit-details-marker{display:none}
.news pre{white-space:pre-wrap;word-break:break-word;font:inherit;font-size:13px;color:var(--tx2);margin:8px 0 0;max-height:320px;overflow:auto}
.prog{height:5px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden;flex:1}
.prog i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s;border-radius:3px}
.prog i.ok{background:var(--green)} .prog i.err{background:var(--red)} .prog i.empty{background:var(--yellow)}
.dsrow{display:flex;align-items:center;gap:8px;font-size:13px;padding:5px 0}
.dsrow .lb{width:118px;flex:none;color:var(--tx2)} .dsrow .st{width:64px;flex:none;text-align:right;color:var(--tx3);font-size:12px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
td,th{padding:9px 4px;border-bottom:.5px solid var(--line);text-align:left} th{color:var(--tx3);font-weight:500;font-size:12px}
td.r,th.r{text-align:right}
.empty{text-align:center;padding:48px 16px;color:var(--tx2)}
.empty .big{font-size:44px;margin-bottom:10px}
#toast{position:fixed;left:50%;bottom:calc(var(--nav-bottom) + var(--nav-h) + 14px);transform:translateX(-50%) translateY(12px);opacity:0;
  background:rgba(44,44,50,.75);-webkit-backdrop-filter:var(--glass);backdrop-filter:var(--glass);border:.5px solid var(--stroke2);
  color:#fff;padding:10px 18px;border-radius:999px;font-size:14.5px;font-weight:600;transition:.25s;pointer-events:none;z-index:50;
  max-width:92vw;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#toast{visibility:hidden}
#toast.show{opacity:1;visibility:visible;transform:translateX(-50%) translateY(0)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
svg.chart{width:100%;height:64px;display:block}
.hint{font-size:12.5px;color:var(--tx3);margin-top:6px;line-height:1.6}
.sep{height:.5px;background:var(--line);margin:14px 0}
.offline{background:var(--yellow-bg);color:var(--yellow);font-size:12.5px;padding:8px 12px;border-radius:12px;margin-bottom:12px;display:none}
#updBar{position:fixed;z-index:40;left:50%;top:calc(var(--sat) + 8px);transform:translate(-50%,calc(-100% - var(--sat) - 40px));opacity:0;visibility:hidden;pointer-events:none;
  transition:transform .4s cubic-bezier(.3,1.25,.5,1),opacity .25s,visibility 0s .4s;
  display:flex;align-items:center;gap:8px;padding:10px 18px;border-radius:999px;font:inherit;font-size:14.5px;font-weight:600;color:#fff;border:.5px solid var(--stroke2);
  background:rgba(44,44,50,.75);-webkit-backdrop-filter:var(--glass);backdrop-filter:var(--glass);box-shadow:0 8px 24px rgba(0,0,0,.4);white-space:nowrap}
#updBar.show{transform:translate(-50%,0);opacity:1;visibility:visible;pointer-events:auto;transition:transform .4s cubic-bezier(.3,1.25,.5,1),opacity .25s,visibility 0s}
/* ---------- 總覽卡、份量標籤、小百科、圖表觸控 ---------- */
.overview{padding:18px}
.overview small{display:block;color:var(--tx2);font-size:12.5px;margin-bottom:2px}
.big-num{font-size:28px;font-weight:700;letter-spacing:-.3px;font-variant-numeric:tabular-nums}
.big-num span{font-size:14px;font-weight:600;color:var(--tx2)}
.ov-text{margin-top:12px;font-size:14.5px;line-height:1.6;color:var(--tx2)}
.ov-text b{color:var(--tx)}
.tier{display:inline-block;margin-left:6px;font-size:11px;font-weight:600;padding:2px 7px;border-radius:999px;background:rgba(255,255,255,.08);color:var(--tx2);vertical-align:2px}
.tier.main{background:rgba(10,132,255,.18);color:#64b0ff}
.tier.small{background:rgba(255,255,255,.05);color:var(--tx3)}
.calm{margin-top:10px;font-size:12.5px;color:var(--tx3)}
.alertbox{border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:13.5px;line-height:1.55}
.alertbox.red{background:var(--red-bg)} .alertbox.yellow{background:var(--yellow-bg)}
.alertbox .small{margin-top:4px;color:var(--tx2)}
.qm{display:inline-flex;align-items:center;justify-content:center;width:17px;height:17px;border-radius:50%;border:0;padding:0;margin-left:3px;
  background:rgba(255,255,255,.12);color:var(--tx2);font:600 11px/1 -apple-system,sans-serif;vertical-align:1px}
.pro{font-weight:500;color:var(--tx3);font-size:11.5px;margin-left:4px}
.detail h5{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.editable{cursor:pointer;box-shadow:inset 0 0 0 1px rgba(10,132,255,.35)}
.editable small{color:#64b0ff !important}
.vq{margin-top:8px;font-size:14px;line-height:1.55}
.vq span{display:inline-block;font-size:11.5px;font-weight:700;color:var(--tx2);margin-right:6px;padding:1px 7px;border-radius:999px;background:rgba(0,0,0,.25)}
.vq.fam span{color:#d9a6ff}
.chk{font-size:11px;color:var(--tx3);white-space:nowrap}
.chart-wrap{touch-action:pan-y;user-select:none;-webkit-user-select:none}
.readout{display:flex;justify-content:space-between;font-size:12px;color:var(--tx3);margin-top:2px}
.readout b{color:var(--tx);font-weight:600;font-variant-numeric:tabular-nums}
.backup-banner{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;margin-bottom:12px;border-radius:16px;background:var(--card);border:.5px solid var(--stroke);font-size:14px;color:var(--tx2)}
.backup-banner b{color:var(--accent);font-weight:600;white-space:nowrap}
.backup-banner.warn{background:var(--yellow-bg);border-color:rgba(255,214,10,.25);color:var(--yellow)}
#sheet{position:fixed;inset:0;z-index:60;visibility:hidden}
#sheet.show{visibility:visible}
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.45);opacity:0;transition:opacity .25s}
#sheet.show .sheet-bg{opacity:1}
.sheet-card{position:absolute;left:10px;right:10px;bottom:calc(var(--sab) + 10px);padding:20px 20px 16px;border-radius:28px;
  background:rgba(40,40,46,.82);-webkit-backdrop-filter:var(--glass);backdrop-filter:var(--glass);border:.5px solid var(--stroke2);
  transform:translateY(120%);transition:transform .35s cubic-bezier(.3,1.15,.5,1)}
#sheet.show .sheet-card{transform:none}
.sheet-card h3{margin:0 0 8px;font-size:18px} .sheet-card p{margin:0;color:var(--tx2);line-height:1.65;font-size:15px}
.stg{animation:stg .3s ease both}
@keyframes stg{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
body.scrolled header{pointer-events:auto;cursor:pointer}
@media (prefers-reduced-motion: reduce){.stg{animation:none}}
/* ---------- 隱私模式、健康分數、股息日曆 ---------- */
#privBtn{position:absolute;left:calc(var(--sal) + 14px);pointer-events:auto;width:34px;height:34px;border-radius:50%;border:0;display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.10);color:var(--tx2);-webkit-backdrop-filter:var(--glass);backdrop-filter:var(--glass)}
#privBtn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

body.privacy .money{filter:blur(7px);transition:filter .2s}
.health{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.04);border-radius:16px;padding:8px 12px 8px 4px;margin-bottom:6px}
.health small{display:flex;align-items:center;color:var(--tx2);font-size:12.5px}
.hs{font-size:38px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.hs span{font-size:15px;font-weight:600;margin-left:6px}
.radar{flex:none}
.ov-health{display:flex;align-items:baseline;gap:8px;margin-top:12px;font-size:13px;color:var(--tx2)}

<script>
'use strict';
const APP_VERSION = '2026.11.24-r15'; // 每次更新畫面都要改這個版本號
/* =========================================================
 *  基礎工具
 * ========================================================= */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
function num(v) {
  if (v == null) return null;
  if (typeof v === 'number') return isFinite(v) ? v : null;
  const s = String(v).replace(/[,\s%＋]/g, '').replace(/^\+/, '').replace(/[()]/g, '');
  if (s === '' || s === '-' || s === '--' || s === '---' || /^N\/?A$/i.test(s) || s === '不適用') return null;
  const n = Number(s);
  return isFinite(n) ? n : null;
}
function fmt(n, d = 0) { if (n == null || !isFinite(n)) return '—'; let x = Number(n); if (Math.abs(x) < 0.5 * 10 ** -d) x = 0; return x.toLocaleString('zh-TW', { minimumFractionDigits: d, maximumFractionDigits: d }); }
function sgn(n, d = 1, suf = '%') { if (n == null) return '<span class="faint">—</span>'; const c = n > 0 ? 'up' : n < 0 ? 'down' : ''; return `<span class="${c} mono">${n > 0 ? '+' : ''}${fmt(n, d)}${suf}</span>`; }
function toast(msg, ms = 2400) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), ms); }
function twNow() { return new Date(Date.now() + 8 * 3600e3); }
function ymd(d) { return `${d.getUTCFullYear()}${String(d.getUTCMonth() + 1).padStart(2, '0')}${String(d.getUTCDate()).padStart(2, '0')}`; }
function prettyDate(s) { s = String(s || ''); return s.length === 8 ? `${s.slice(0, 4)}/${s.slice(4, 6)}/${s.slice(6)}` : s; }
/** 民國/西元各式日期 → YYYYMMDD */
function normDate(v) {
  if (v == null) return '';
  let s = String(v).trim();
  let m = s.match(/^(\d{2,4})[\/\-.年](\d{1,2})[\/\-.月](\d{1,2})/);
  if (m) { let y = +m[1]; if (y < 1911) y += 1911; return `${y}${m[2].padStart(2, '0')}${m[3].padStart(2, '0')}`; }
  s = s.replace(/\D/g, '');
  if (s.length === 8) return s;
  if (s.length === 7) return `${+s.slice(0, 3) + 1911}${s.slice(3)}`;
  if (s.length === 6) return `${+s.slice(0, 2) + 1911}${s.slice(2)}`; // 民國兩位年（極少見）
  return '';
}
function daysBetween(a, b) { // YYYYMMDD
  const p = s => Date.UTC(+s.slice(0, 4), +s.slice(4, 6) - 1, +s.slice(6, 8));
  return Math.round((p(b) - p(a)) / 864e5);
}

/* ---------- 欄位模糊對應（官方各 API 欄位名中英混用、偶有尾端空白） ---------- */
function fkey(row, inc, exc) { for (const k of Object.keys(row)) { const kk = k.trim(); if (inc.test(kk) && !(exc && exc.test(kk))) return k; } return null; }
function fval(row, inc, exc) { const k = fkey(row, inc, exc); return k == null ? undefined : row[k]; }
function fnum(row, inc, exc) { return num(fval(row, inc, exc)); }
const RE_CODE = /^(公司代號|證券代號|股票代號|代號|有價證券代號|SecuritiesCompanyCode|CompanyCode|StockCode|Code|StockNo)$/i;
const RE_NAME = /^(公司名稱|公司簡稱|證券名稱|股票名稱|名稱|有價證券名稱|CompanyName|CompanyAbbreviation|Name|StockName)$/i;
function rowCode(r) { let v = fval(r, RE_CODE); if (v == null) v = fval(r, /代號|code/i, /產業|industry|型態/i); return v == null ? null : String(v).trim().toUpperCase(); }
function rowName(r) { const v = fval(r, RE_NAME); return v == null ? '' : String(v).trim(); }

/* =========================================================
 *  IndexedDB（主要儲存）＋ localStorage（API Key）
 * ========================================================= */
const DB = {
  _db: null,
  open() {
    if (this._db) return Promise.resolve(this._db);
    return new Promise((res, rej) => {
      const r = indexedDB.open('tw-stock-radar', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('kv');
      r.onsuccess = () => { this._db = r.result; res(this._db); };
      r.onerror = () => rej(r.error);
    });
  },
  async get(k) { const db = await this.open(); return new Promise((res, rej) => { const q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); },
  async set(k, v) { const db = await this.open(); return new Promise((res, rej) => { const t = db.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = () => res(); t.onerror = () => rej(t.error); }); },
  async clear() { const db = await this.open(); return new Promise((res, rej) => { const t = db.transaction('kv', 'readwrite'); t.objectStore('kv').clear(); t.oncomplete = () => res(); t.onerror = () => rej(t.error); }); },
};
const LS = { get: k => { try { return localStorage.getItem(k) || ''; } catch { return ''; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch { } } };

/* =========================================================
 *  狀態
 * ========================================================= */
const DEFAULTS = {
  workerUrl: 'https://tw-stock-radar.timmychu8.workers.dev',
  colorIntl: false,
  aiRpm: 5,        // AI 每分鐘最多請求次數（Gemini 免費版 = 5）
  aiBatch: 4,      // 批次查核時，每次請求合併幾檔
  autoUpdate: true,          // 開啟 App 時自動更新
  autoTimes: '16:30, 21:30', // 每天的更新時間點（台灣時間）
  aiProvider: 'gemini',
  geminiModel: 'gemini-3.6-flash',
  claudeModel: 'claude-sonnet-5-5',
  revDown: -25,     // 營收 YoY ≤ 此值 → 高風險
  revUp: 30,        // 營收 YoY ≥ 此值 → 利多
  bigWeeks: 2,      // 千張大戶連續 N 週減少
  bigDrop: 0.5,     // 且累計減少 ≥ 此百分點
  instiDays: 3,     // 三大法人連續 N 日賣超
  instiLots: 300,   // 且累計賣超 ≥ 此張數
  creditJump: 15,   // 融資餘額單日增加 ≥ %
  newsDays: 10,     // 重訊回看天數
  yieldHigh: 6,     // 殖利率 ≥ % 顯示高息標籤
  backfillDays: 5,  // 上市法人歷史回補日數
  instiPct: 0.15,   // 法人累計買賣超 ≥ 總股本 %（查不到股本時改用 instiLots 張數）
  creditPct: 0.05,  // 融資單日增加量 ≥ 總股本 %
  pledgeHigh: 50,   // 董監質押比例 ≥ %
  drop5: 10,        // 近 5 日跌幅 ≥ %（加倍為高風險）
  tierMain: 10000,  // 主力持股：持有市值 ≥ 元
  tierMid: 1000,    // 一般持股：持有市值 ≥ 元（以下為零星股）
  lastBackup: 0,
};
const S = {
  holdings: [], settings: { ...DEFAULTS }, market: null,
  hist: { insti: {}, instiEmpty: {}, tdcc: {}, credit: {}, price: {} },
  ai: {}, sources: {},
  ui: { lim: { alerts: 25, radar: 80, holdings: 100 }, tab: 'alerts', open: null, q: '', sort: 'alerts', filter: 'all', alertFilter: 'risk', importMode: 'merge', importPreview: null },
  busy: false, aiBusy: new Set(),
};
async function load() {
  const [h, s, m, hist, ai, src] = await Promise.all(['holdings', 'settings', 'market', 'hist', 'ai', 'sources'].map(k => DB.get(k)));
  S.holdings = h || [];
  S.settings = { ...DEFAULTS, ...(s || {}) };
  if (!S.settings.workerUrl) S.settings.workerUrl = DEFAULTS.workerUrl;
  if (!S.settings.geminiModel || S.settings.geminiModel === 'gemini-2.5-flash') S.settings.geminiModel = DEFAULTS.geminiModel;
  S.market = m || null;
  S.hist = { insti: {}, instiEmpty: {}, tdcc: {}, credit: {}, price: {}, ...(hist || {}) };
  S.ai = ai || {};
  S.sources = src || {};
}
const save = {
  holdings: () => DB.set('holdings', S.holdings),
  settings: () => DB.set('settings', S.settings),
  market: () => DB.set('market', S.market),
  hist: () => DB.set('hist', S.hist),
  ai: () => DB.set('ai', S.ai),
  sources: () => DB.set('sources', S.sources),
};

/* =========================================================
 *  資料集定義（對應 worker.js 的 DATASETS）
 * ========================================================= */
const DS = [
  ['news_L', '上市 重大訊息'], ['news_O', '上櫃 重大訊息'],
  ['rev_L', '上市 月營收'], ['rev_O', '上櫃 月營收'],
  ['eps_L', '上市 EPS'], ['eps_O', '上櫃 EPS'],
  ['prof_L', '上市 三率'], ['prof_O', '上櫃 三率'],
  ['div_L', '上市 股利分派'], ['div_O', '上櫃 股利分派'],
  ['exdiv_L', '上市 除權息'], ['exdiv_O', '上櫃 除權息'],
  ['pe_L', '上市 殖利率'], ['pe_O', '上櫃 殖利率'],
  ['price_L', '上市 收盤價'], ['price_O', '上櫃 收盤價'],
  ['insti_L', '上市 三大法人'], ['insti_O', '上櫃 三大法人'],
  ['credit_L', '上市 融資融券'], ['credit_O', '上櫃 融資融券'],
  ['tdcc', '集保 股權分散'],
  ['basic_L', '上市 公司股本'], ['basic_O', '上櫃 公司股本'],
  ['punish_L', '上市 處置股'], ['punish_O', '上櫃 處置股'],
  ['notice_L', '上市 注意股'], ['notice_O', '上櫃 注意股'],
  ['agm_L', '上市 股東會'], ['agm_O', '上櫃 股東會'],
  ['pledge_L', '上市 董監質押'], ['pledge_O', '上櫃 董監質押'],
];

/* =========================================================
 *  正規化器：官方原始資料 → 每檔持股的標準欄位
 * ========================================================= */
const NEWS_NEG = /減資彌補|虧損|停工|停產|違約|跳票|退票|下市|終止上市|終止(上櫃|櫃檯買賣)|變更交易方法|全額交割|分盤交易|處置|重大訴訟|起訴|搜索|羈押|重整|破產|解散|停止營業|停止營運|財務困難|無法表示意見|否定意見|保留意見|繼續經營.{0,6}(疑慮|不確定)|減損損失|鉅額.*損失|背書保證.{0,10}超|資金貸與.{0,10}超|火災|爆炸|災損|裁罰|罰鍰|下修|調降.{0,6}(財測|目標)|(董事長|總經理|執行長|財務主管|會計主管|財會主管).{0,8}(辭|解任|異動|變動)|簽證會計師.{0,6}(異動|更換|變更)|股權.{0,4}(質押|設質)|大量出售/;
const NEWS_HARD = /變更交易方法|全額交割|終止上市|終止(上櫃|櫃檯買賣)|重整|破產|跳票|退票|財務困難|無法表示意見|否定意見/;
const NEWS_ROUTINE = /法說會|法人說明會|受邀|參加.{0,12}(論壇|研討會|座談|展覽|展會|說明會)|股東(常|臨時)會.{0,10}(召開|議事錄|決議|日期|開會)|召開.{0,6}股東(常|臨時)會|開會通知|自結|董事會.{0,10}(通過|決議).{0,10}(財務報告|財報)|財務報告.{0,6}(經|業經)|代子公司.{0,30}(使用權資產|機器設備|設備)|背書保證.{0,6}餘額|資金貸與.{0,6}餘額|補充公告|更正.{0,6}公告|除(權|息).{0,8}(基準日|交易日)|基準日|發放日|股票股利.{0,6}發放|取得.{0,10}(機器|設備|使用權)/;
const NEWS_POS = /庫藏股|買回.{0,6}(本公司)?股份|股利分派|配發.{0,6}股利|現金股利|創.{0,6}新高|調升|上修|得標|簽訂.{0,10}(合約|契約)|取得.{0,6}訂單|策略聯盟/;
const NEWS_WATCH = /減資|私募|併購|合併|收購|公開收購|處分|取得.{0,10}(不動產|股權|有價證券|股份)|董事.{0,8}(異動|辭|解任|改選)|獨立董事|發言人.{0,6}異動|稽核主管|增資|可轉換公司債|轉換公司債|股權轉讓|停止買賣|暫停交易|恢復交易|澄清|媒體報導|子公司.{0,6}(處分|出售)/;
function classifyNews(subject, desc) {
  const s = subject || '';
  if (NEWS_NEG.test(s) || NEWS_HARD.test((desc || '').slice(0, 400))) return 'neg';
  if (NEWS_ROUTINE.test(s)) return 'routine';
  if (NEWS_POS.test(s)) return 'pos';
  if (NEWS_WATCH.test(s)) return 'watch';
  return 'info';
}

function parseT86(obj) {
  // TWSE T86：{stat, date, fields:[...], data:[[...]]}
  const f = obj.fields || [];
  const idx = re => f.findIndex(x => re.test(String(x).trim()));
  const iCode = idx(/證券代號/), iName = idx(/證券名稱/);
  const iF = idx(/^外陸資買賣超|^外資買賣超/), iT = idx(/^投信買賣超/);
  let iD = idx(/^自營商買賣超股數$/); if (iD < 0) iD = idx(/^自營商買賣超/);
  const iTot = idx(/三大法人買賣超/);
  return (obj.data || []).map(r => ({
    code: String(r[iCode] || '').trim(), name: String(r[iName] || '').trim(),
    f: num(r[iF]), t: num(r[iT]), d: num(r[iD]), tot: num(r[iTot]),
  }));
}
function parseInstiRow(r) {
  // 上櫃 OpenAPI：欄位名稱可能中/英文，採模糊比對；單位：股
  const f = fnum(r, /(外資及陸資|外陸資|Foreign.*Investors?).*(買賣超|Diff|Net)/i, /^外資自營商|^Foreign ?Dealers?/i);
  const t = fnum(r, /(投信|Investment ?Trust).*(買賣超|Diff|Net)/i);
  let d = fnum(r, /^(自營商|Dealers?)(合計)?[-\s]?(買賣超|Diff|Net)/i);
  if (d == null) d = fnum(r, /^(自營商|Dealers?).*(買賣超|Diff|Net)/i, /自行|避險|Proprietary|Hedg/i);
  let tot = fnum(r, /(三大法人|Total).*(買賣超|Diff|Net)/i);
  if (tot == null && (f != null || t != null || d != null)) tot = (f || 0) + (t || 0) + (d || 0);
  return { f, t, d, tot };
}

function normalizeAll(raw, codes) {
  const set = new Set(codes);
  const stocks = {};
  const st = c => (stocks[c] ||= { code: c, news: [], routine: 0 });
  const each = (key, fn) => { const arr = raw[key]; if (Array.isArray(arr)) for (const r of arr) { const c = rowCode(r); if (c && set.has(c)) fn(st(c), r); } };
  const mk = key => key.endsWith('_O') ? '上櫃' : '上市';

  // 收盤價（同時判定市場別）
  for (const key of ['price_L', 'price_O']) each(key, (s, r) => {
    s.market = mk(key); s.name ||= rowName(r);
    s.price = { close: fnum(r, /^(ClosingPrice|Close|收盤價?)$/i), chg: fnum(r, /^(Change|漲跌(價差)?)$/i), vol: fnum(r, /^(TradeVolume|TradingShares|成交股數)$/i) };
  });
  for (const key of ['rev_L', 'rev_O']) each(key, (s, r) => {
    s.market ||= mk(key); s.name ||= rowName(r);
    s.rev = {
      ym: String(fval(r, /資料年月|年月/) || ''), rev: fnum(r, /當月營收/), mom: fnum(r, /上月比較增減/), yoy: fnum(r, /去年同月增減/),
      cum: fnum(r, /當月累計營收/), cumYoy: fnum(r, /前期比較增減/), note: String(fval(r, /備註/) || '').trim(),
    };
  });
  for (const key of ['eps_L', 'eps_O']) each(key, (s, r) => {
    s.name ||= rowName(r);
    s.eps = { y: String(fval(r, /^年度$|Year/i) || ''), q: String(fval(r, /^季別$|Season|Quarter/i) || ''), eps: fnum(r, /每股盈餘|EPS/i), rev: fnum(r, /^營業收入/), op: fnum(r, /^營業利益/), net: fnum(r, /稅後淨利|本期淨利/) };
  });
  for (const key of ['prof_L', 'prof_O']) each(key, (s, r) => {
    s.prof = { y: String(fval(r, /^年度$/) || ''), q: String(fval(r, /^季別$/) || ''), gm: fnum(r, /^毛利率/), om: fnum(r, /^營業利益率/), pm: fnum(r, /^稅後純益率|^稅後淨利率/) };
  });
  for (const key of ['div_L', 'div_O']) each(key, (s, r) => {
    let cash = 0, stock = 0;
    for (const k of Object.keys(r)) {
      if (!/元\/股/.test(k)) continue;
      const v = num(r[k]) || 0;
      if (/現金/.test(k)) cash += v; else if (/配股/.test(k)) stock += v;
    }
    const yr = String(fval(r, /所屬年|股利年度|^年度/) || '').trim();
    const period = String(fval(r, /所屬期間|期別/) || '').trim();
    const progress = String(fval(r, /決議|進度/) || '').trim();
    (s.divRows ||= []).push({ yr, period, cash: +cash.toFixed(4), stock: +stock.toFixed(4), progress });
  });
  for (const key of ['exdiv_L', 'exdiv_O']) each(key, (s, r) => {
    const d = normDate(fval(r, /^(Date|除權除息日期|除權息日期|除息交易日|除權息交易日|日期)$/i));
    const cash = fnum(r, /CashDividend|現金股利|息值/i);
    const type = String(fval(r, /^(Exdividend|除權息|權值\+息值|類別)$/i) || '').trim();
    if (!d) return;
    if (!s.exdiv || d < s.exdiv.date) s.exdiv = { date: d, cash, type };
  });
  for (const key of ['pe_L', 'pe_O']) each(key, (s, r) => {
    s.pe = { yld: fnum(r, /DividendYield|YieldRatio|殖利率/i), pe: fnum(r, /PEratio|PriceEarningRatio|本益比/i), pb: fnum(r, /PBratio|PriceBookRatio|股價淨值比/i) };
  });
  for (const key of ['credit_L', 'credit_O']) each(key, (s, r) => {
    s.credit = {
      m: fnum(r, /融資今日餘額|^資餘額|^融資餘額|MarginPurchase.*(Today|Balance)$/i, /前|限額|Prev|Yesterday/i),
      mPrev: fnum(r, /融資前日餘額|^前資餘額|MarginPurchase.*(Prev|Yesterday)/i),
      s: fnum(r, /融券今日餘額|^券餘額|^融券餘額|ShortSale.*(Today|Balance)$/i, /前|限額|Prev|Yesterday/i),
      sPrev: fnum(r, /融券前日餘額|^前券餘額|ShortSale.*(Prev|Yesterday)/i),
      limit: fnum(r, /融資限額|^資限額/),
    };
  });
  // 重大訊息
  for (const key of ['news_L', 'news_O']) each(key, (s, r) => {
    s.name ||= rowName(r);
    const subject = String(fval(r, /主旨|Subject/i) || '').trim();
    const desc = String(fval(r, /^說明|Description/i) || '').trim();
    const cat = classifyNews(subject, desc);
    const date = normDate(fval(r, /發言日期|^Date$/i)) || normDate(fval(r, /出表日期/));
    const n = { date, time: String(fval(r, /發言時間|Time/i) || ''), subject, clause: String(fval(r, /符合條款/) || '').trim(), fact: normDate(fval(r, /事實發生日/)), desc, cat };
    s.news.push(n);
  });
  // 公司基本資料：已發行股數（算「占股本比例」用）
  for (const key of ['basic_L', 'basic_O']) each(key, (s, r) => {
    let sh = fnum(r, /已發行普通股數|發行股數/);
    if (sh == null) { const cap = fnum(r, /實收資本額/); const par = num(String(fval(r, /每股面額/) || '').replace(/[^\d.]/g, '')) || 10; if (cap) sh = cap / par; }
    if (sh) s.sharesOut = sh;
    s.industry = String(fval(r, /^產業別$/) || '').trim();
  });
  for (const key of ['punish_L', 'punish_O']) each(key, (s, r) => {
    s.punish = { period: String(fval(r, /DispositionPeriod|處置期間|期間/i) || '').trim(), measure: String(fval(r, /DispositionMeasures|處置措施|措施/i) || '').trim().slice(0, 120), reason: String(fval(r, /ReasonsOfDisposition|處置條件|原因/i) || '').trim().slice(0, 120) };
  });
  for (const key of ['notice_L', 'notice_O']) each(key, (s, r) => {
    s.notice = { info: String(fval(r, /TradingInfoForAttention|注意交易資訊|資訊/i) || '').trim().slice(0, 160) };
  });
  const todayN = ymd(twNow());
  for (const key of ['agm_L', 'agm_O']) each(key, (s, r) => {
    const d = normDate(fval(r, /開會日期|會議日期|股東會日期|召開日期|^日期$/, /出表/)); if (!d) return;
    const cand = { date: d, type: String(fval(r, /常會|臨時|會別|類別/) || '').trim() };
    // 優先取今天之後最近的一場
    if (!s.agm || (d >= todayN && (s.agm.date < todayN || d < s.agm.date)) || (d < todayN && s.agm.date < todayN && d > s.agm.date)) s.agm = cand;
  });
  for (const key of ['pledge_L', 'pledge_O']) each(key, (s, r) => {
    if (/合計|總計/.test(JSON.stringify(r))) return;
    const held = fnum(r, /目前持股|持股股數|^持股$|現在持股/, /設質|比例|選任|%/); const pl = fnum(r, /設質股數|質押股數/, /比例|%/);
    const o = (s._pl ||= { held: 0, pl: 0 }); if (held) o.held += held; if (pl) o.pl += pl;
  });
  // 股利：取最新年度合計（季配息加總）
  for (const s of Object.values(stocks)) {
    if (s._pl) { if (s._pl.held) s.pledgeRatio = +(s._pl.pl / s._pl.held * 100).toFixed(2); delete s._pl; }
    if (s.divRows?.length) {
      const years = s.divRows.map(x => x.yr).filter(Boolean).sort();
      const ly = years[years.length - 1] || '';
      const seen = new Set();
      const rows = (ly ? s.divRows.filter(x => x.yr === ly) : s.divRows).filter(x => { const k = `${x.yr}|${x.period}|${x.cash}|${x.stock}`; if (seen.has(k)) return false; seen.add(k); return true; });
      s.div = { yr: ly, cash: +rows.reduce((a, b) => a + b.cash, 0).toFixed(4), stock: +rows.reduce((a, b) => a + b.stock, 0).toFixed(4), n: rows.length, progress: rows[rows.length - 1]?.progress || '' };
      if (s.price?.close && s.div.cash) s.div.yldCalc = +(s.div.cash / s.price.close * 100).toFixed(2);
    }
    s.news.sort((a, b) => (b.date + b.time).localeCompare(a.date + a.time));
  }
  return stocks;
}

function parseTdccCsv(text, set) {
  // 欄位：資料日期,證券代號,持股分級,人數,股數,占集保庫存數比例%
  // 分級 12~15 = 400 張以上；15 = 1,000 張以上；17 = 合計
  const out = {}; let date = '';
  const lines = text.split(/\r?\n/);
  for (let i = 1; i < lines.length; i++) {
    const line = lines[i]; if (!line) continue;
    const c1 = line.indexOf(','), c2 = line.indexOf(',', c1 + 1);
    const code = line.slice(c1 + 1, c2).replace(/"/g, '').trim();
    if (!set.has(code)) continue;
    const cols = line.replace(/"/g, '').split(',');
    date ||= normDate(cols[0]);
    const lv = +cols[2], ppl = num(cols[3]), pct = num(cols[5]);
    const o = (out[code] ||= { p400: 0, p1000: 0, n400: 0, n1000: 0, nAll: 0 });
    if (lv >= 12 && lv <= 15) { o.p400 += pct || 0; o.n400 += ppl || 0; }
    if (lv === 15) { o.p1000 = pct || 0; o.n1000 = ppl || 0; }
    if (lv === 17) o.nAll = ppl || 0;
  }
  for (const o of Object.values(out)) { o.p400 = +o.p400.toFixed(2); o.p1000 = +o.p1000.toFixed(2); }
  return { date, map: out };
}

/* =========================================================
 *  抓取官方資料（經由 Worker）
 * ========================================================= */
function apiBase() { return (S.settings.workerUrl || '').trim().replace(/\/+$/, ''); }
async function fetchDs(key, qs = '') {
  const base = apiBase();
  const r = await fetch(`${base}/api/${key}${qs}`, { cache: 'no-store' });
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  const meta = { src: r.headers.get('X-Source-Url') || '', dataDate: r.headers.get('X-Data-Date') || '', empty: r.headers.get('X-Empty') === '1' };
  const text = await r.text();
  if (key === 'tdcc') return { text, meta };
  const data = JSON.parse(text);
  return { data, meta };
}
function setProg(key, state, note = '') {
  S.sources[key] = { ...(S.sources[key] || {}), state, note, at: state === 'ok' ? Date.now() : (S.sources[key]?.at || 0) };
  const el = document.querySelector(`[data-ds="${key}"]`);
  if (el) {
    const i = $('i', el); i.className = state === 'ok' ? 'ok' : state === 'err' ? 'err' : state === 'empty' ? 'empty' : '';
    i.style.width = state === 'loading' ? '45%' : '100%';
    $('.st', el).textContent = note || ({ loading: '抓取中…', ok: '完成', err: '失敗', empty: '無資料', wait: '等待' }[state] || '');
  }
  const done = DS.filter(([k]) => ['ok', 'err', 'empty'].includes(S.sources[k]?.state)).length;
  $('#topbar').style.width = state === 'idle' ? '0' : `${Math.round(done / DS.length * 100)}%`;
}

async function updateAll() {
  if (S.busy) return;
  if (!apiBase()) { toast('請先到「設定」填入 Worker 網址'); switchTab('settings'); return; }
  if (!S.holdings.length) { toast('請先到「名單管理」匯入持股'); switchTab('holdings'); return; }
  S.busy = true; renderAll();
  const codes = S.holdings.map(h => h.code);
  const set = new Set(codes);
  const raw = {}; let tdcc = null; let tradeDate = ''; const instiToday = {}; let instiODate = '';
  DS.forEach(([k]) => setProg(k, 'wait'));

  const queue = DS.map(([k]) => k);
  const worker = async () => {
    while (queue.length) {
      const key = queue.shift();
      setProg(key, 'loading');
      try {
        const res = await fetchDs(key);
        if (key === 'tdcc') {
          tdcc = parseTdccCsv(res.text, set);
          setProg(key, Object.keys(tdcc.map).length ? 'ok' : 'empty', `${Object.keys(tdcc.map).length} 檔`);
        } else if (key === 'insti_L') {
          const rows = Array.isArray(res.data) ? [] : parseT86(res.data);
          tradeDate = res.meta.dataDate || normDate(res.data?.date) || '';
          let n = 0; for (const r of rows) if (set.has(r.code)) { instiToday[r.code] = { f: r.f, t: r.t, d: r.d, tot: r.tot }; n++; }
          setProg(key, rows.length ? 'ok' : 'empty', `${n} 檔`);
        } else if (key === 'insti_O') {
          let n = 0;
          if (Array.isArray(res.data)) for (const r of res.data) {
            const c = rowCode(r); if (!c || !set.has(c)) continue;
            instiODate ||= normDate(fval(r, /^(Date|日期|資料日期)$/i));
            instiToday[c] = parseInstiRow(r); n++;
          }
          setProg(key, res.data?.length ? 'ok' : 'empty', `${n} 檔`);
        } else {
          raw[key] = Array.isArray(res.data) ? res.data : [];
          const n = raw[key].reduce((a, r) => a + (set.has(rowCode(r)) ? 1 : 0), 0);
          setProg(key, raw[key].length ? 'ok' : 'empty', `${n} 筆`);
        }
        S.sources[key].src = res.meta.src;
      } catch (e) {
        setProg(key, 'err', '失敗');
        S.sources[key].error = String(e.message || e);
      }
    }
  };
  await Promise.all([worker(), worker(), worker(), worker()]);

  // ---- 組合 ----
  const stocks = normalizeAll(raw, codes);
  const today = ymd(twNow());
  const dataDay = tradeDate || instiODate || today;
  if (Object.keys(instiToday).length) {
    S.hist.insti[dataDay] = { ...(S.hist.insti[dataDay] || {}), ...instiToday };
  }
  const creditSnap = {};
  for (const [c, s] of Object.entries(stocks)) if (s.credit?.m != null) creditSnap[c] = { m: s.credit.m, s: s.credit.s };
  if (Object.keys(creditSnap).length) S.hist.credit[dataDay] = creditSnap;
  if (tdcc?.date) S.hist.tdcc[tdcc.date] = tdcc.map;
  const priceSnap = {};
  for (const [c, s] of Object.entries(stocks)) if (s.price?.close != null) priceSnap[c] = { c: s.price.close, v: s.price.vol };
  if (Object.keys(priceSnap).length) (S.hist.price ||= {})[dataDay] = priceSnap;

  S.market = { updatedAt: Date.now(), tradeDate: dataDay, tdccDate: tdcc?.date || '', stocks };
  // 名稱回填
  for (const h of S.holdings) if (stocks[h.code]?.name) h.name = stocks[h.code].name;
  prune();
  await Promise.all([save.market(), save.hist(), save.holdings(), save.sources()]);
  renderAll();

  // ---- 上市三大法人歷史回補（判斷「連續賣超」用；TWSE 有頻率限制，逐日慢慢抓） ----
  if (tradeDate) await backfillInsti(tradeDate, set);

  S.busy = false; $('#topbar').style.width = '0';
  renderAll();
  toast('✅ 官方數據更新完成');
}

async function backfillInsti(latest, set) {
  const need = [];
  const d = new Date(Date.UTC(+latest.slice(0, 4), +latest.slice(4, 6) - 1, +latest.slice(6, 8)));
  for (let i = 1; i <= 12 && need.length < S.settings.backfillDays; i++) {
    const x = new Date(d); x.setUTCDate(d.getUTCDate() - i);
    const dow = x.getUTCDay(); if (dow === 0 || dow === 6) continue;
    const k = ymd(x);
    if (S.hist.insti[k] && Object.keys(S.hist.insti[k]).length) { need.push(null); continue; }
    if (S.hist.instiEmpty[k]) continue;
    need.push(k);
  }
  const todo = need.filter(Boolean);
  for (let i = 0; i < todo.length; i++) {
    const k = todo[i];
    $('#hdrSub').textContent = `回補上市法人歷史 ${prettyDate(k)}（${i + 1}/${todo.length}）`;
    try {
      const res = await fetchDs('insti_L', `?date=${k}`);
      const rows = Array.isArray(res.data) ? [] : parseT86(res.data);
      if (!rows.length) S.hist.instiEmpty[k] = 1;
      else { const m = {}; for (const r of rows) if (set.has(r.code)) m[r.code] = { f: r.f, t: r.t, d: r.d, tot: r.tot }; S.hist.insti[k] = { ...m, ...(S.hist.insti[k] || {}) }; }
      await save.hist();
    } catch { /* 下次再補 */ }
    await sleep(2500); // 避免觸發證交所頻率限制
  }
}

function prune() {
  const keep = (obj, n) => { const ks = Object.keys(obj).sort().reverse(); ks.slice(n).forEach(k => delete obj[k]); };
  keep(S.hist.insti, 30); keep(S.hist.tdcc, 16); keep(S.hist.credit, 20); keep(S.hist.price ||= {}, 60);
  const cut = ymd(new Date(Date.now() - 40 * 864e5));
  for (const k of Object.keys(S.hist.instiEmpty)) if (k < cut) delete S.hist.instiEmpty[k];
}

/* =========================================================
 *  異常偵測（兩層過濾：剔除例行公告 → 套用閾值）
 * ========================================================= */
function instiSeries(code) {
  // 注意：法人物件內的 d 是「自營商」，日期用 date
  return Object.keys(S.hist.insti).sort().reverse().map(day => ({ ...(S.hist.insti[day][code] || {}), date: day })).filter(x => x.tot != null);
}
function tdccSeries(code) {
  return Object.keys(S.hist.tdcc).sort().reverse().map(d => ({ d, ...(S.hist.tdcc[d][code] || {}) })).filter(x => x.p1000 != null);
}
function creditSeries(code) {
  return Object.keys(S.hist.credit).sort().reverse().map(d => ({ d, ...(S.hist.credit[d][code] || {}) })).filter(x => x.m != null);
}
const _evalCache = new Map();
function invalidate() { _evalCache.clear(); }
function evaluate(code) {
  if (_evalCache.has(code)) return _evalCache.get(code);
  const r = evaluateRaw(code); _evalCache.set(code, r); return r;
}
function priceSeries(code) {
  const P = S.hist.price || {};
  return Object.keys(P).sort().reverse().map(d => ({ d, ...(P[d][code] || {}) })).filter(x => x.c != null);
}
function holdValue(code) {
  const s = S.market?.stocks?.[code]; const h = S.holdings.find(x => x.code === code);
  return s?.price?.close != null && h?.shares ? s.price.close * h.shares : null;
}
function tierOf(code) {
  const v = holdValue(code); if (v == null) return null;
  return v >= S.settings.tierMain ? 'main' : v >= S.settings.tierMid ? 'mid' : 'small';
}
const TIER_LABEL = { main: '主力持股', mid: '一般持股', small: '零星股' };
const isETF = code => /^00/.test(code);
function evaluateRaw(code) {
  const s = S.market?.stocks?.[code] || {};
  const T = S.settings, out = [];
  const today = ymd(twNow());
  const etf = isETF(code);
  const lotsOut = s.sharesOut ? s.sharesOut / 1000 : null; // 總發行張數
  // 0) 處置股／注意股（交易所公告，最優先）
  if (s.punish) out.push({ lv: 'red', k: 'punish', t: '處置股：交易受到限制', g: 'punish' });
  if (s.notice) out.push({ lv: 'yellow', k: 'notice', t: '注意股：交易出現異常', g: 'notice' });
  // 1) 重大訊息
  for (const n of s.news || []) {
    if (n.date && daysBetween(n.date, today) > T.newsDays) continue;
    const lv = { neg: 'red', pos: 'green', watch: 'yellow' }[n.cat];
    if (lv) out.push({ lv, k: 'news', t: `重訊：${n.subject.slice(0, 40)}`, g: 'news' });
  }
  // 2) 月營收（ETF 不適用）
  if (!etf && s.rev?.yoy != null) {
    if (s.rev.yoy <= T.revDown) out.push({ lv: 'red', k: 'rev', t: `營收較去年衰退 ${fmt(-s.rev.yoy, 1)}%`, g: 'rev' });
    else if (s.rev.yoy >= T.revUp) out.push({ lv: 'green', k: 'rev', t: `營收較去年成長 ${fmt(s.rev.yoy, 1)}%`, g: 'rev' });
  }
  // 3) EPS（ETF 不適用；官方為年度累計值）
  if (!etf && s.eps?.eps != null && s.eps.eps < 0) out.push({ lv: 'yellow', k: 'eps', t: `今年累計虧損（每股 ${fmt(s.eps.eps, 2)} 元）`, g: 'eps' });
  // 4) 三大法人連續同向：改用「占總股本比例」，查不到股本才用張數
  const ins = instiSeries(code);
  if (ins.length) {
    const dir = Math.sign(ins[0].tot); let cnt = 0, sum = 0;
    for (const x of ins) { if (Math.sign(x.tot) !== dir || dir === 0) break; cnt++; sum += x.tot; }
    const lots = Math.abs(sum) / 1000;
    const pct = lotsOut ? lots / lotsOut * 100 : null;
    const hit = cnt >= T.instiDays && (pct != null ? pct >= T.instiPct : lots >= T.instiLots);
    if (hit) out.push({ lv: dir < 0 ? 'red' : 'green', k: 'insti', g: 'insti',
      t: `大型機構連 ${cnt} 日${dir < 0 ? '賣出' : '買進'} ${fmt(lots)} 張${pct != null ? `（占股本 ${fmt(pct, 2)}%）` : ''}` });
  }
  // 5) 融資融券（增加量也要達到股本比例，避免小量就跳警報）
  const c = s.credit;
  if (c?.m != null && c.mPrev) {
    const inc = c.m - c.mPrev, chg = inc / c.mPrev * 100;
    const bigEnough = lotsOut ? inc / lotsOut * 100 >= T.creditPct : inc >= 50;
    if (chg >= T.creditJump && bigEnough) out.push({ lv: 'yellow', k: 'credit', t: `散戶借錢買股暴增 ${fmt(chg, 0)}%`, g: 'margin' });

  }
  // 6) 千張大戶
  const td = tdccSeries(code);
  if (td.length >= 2) {
    let downW = 0, upW = 0;
    for (let i = 0; i < td.length - 1; i++) { if (td[i].p1000 < td[i + 1].p1000) downW++; else break; }
    for (let i = 0; i < td.length - 1; i++) { if (td[i].p1000 > td[i + 1].p1000) upW++; else break; }
    if (downW >= T.bigWeeks) { const drop = td[downW].p1000 - td[0].p1000; if (drop >= T.bigDrop) out.push({ lv: 'red', k: 'big', t: `超級大股東連 ${downW} 週減碼（−${fmt(drop, 2)} 個百分點）`, g: 'big' }); }

  }

  if (s.pledgeRatio != null && s.pledgeRatio >= T.pledgeHigh) out.push({ lv: 'yellow', k: 'pledge', t: `董監事質押 ${fmt(s.pledgeRatio, 0)}% 持股`, g: 'pledge' });
  // 8) 近 5 個交易日急跌（需累積股價歷史）
  const ps = priceSeries(code);
  if (ps.length >= 6 && ps[5].c) {
    const d5 = (ps[0].c - ps[5].c) / ps[5].c * 100;
    if (d5 <= -T.drop5) out.push({ lv: d5 <= -T.drop5 * 2 ? 'red' : 'yellow', k: 'drop', t: `近 5 日股價下跌 ${fmt(-d5, 1)}%`, g: 'drop' });
  }

  const yld = s.pe?.yld ?? s.div?.yldCalc;

  if (s.exdiv?.date && s.exdiv.date >= today && daysBetween(today, s.exdiv.date) <= 21) out.push({ lv: 'info', k: 'ex', t: `${prettyDate(s.exdiv.date).slice(5)} 除${s.exdiv.type || '權息'}`, g: 'exdiv' });
  if (s.agm?.date && s.agm.date >= today && daysBetween(today, s.agm.date) <= 60) out.push({ lv: 'info', k: 'agm', t: `${prettyDate(s.agm.date).slice(5)} 股東會`, g: 'agm' });

}

function streakText(arr, label, unitDiv, unit) {

  const dir = Math.sign(arr[0].v); let n = 0, sum = 0;
  for (const x of arr) { if (Math.sign(x.v) !== dir || !dir) break; n++; sum += x.v; }
  const tot = arr.reduce((a, x) => a + x.v, 0);
  return `${label}：近 ${arr.length} 期合計${tot >= 0 ? '買進' : '賣出'} ${fmt(Math.abs(tot) / unitDiv)} ${unit}；最近連續 ${n} 期${dir >= 0 ? '買進' : '賣出'}，合計 ${fmt(Math.abs(sum) / unitDiv)} ${unit}`;
}

/* 防幻覺：檢查 AI 證據裡的數字是否真的出現在原始資料 */
function numberPool(obj) {
  const pool = new Set();
  const add = n => { if (!isFinite(n)) return; const a = Math.abs(n); [a, Math.round(a), +a.toFixed(1), +a.toFixed(2)].forEach(x => pool.add(String(x))); };
  JSON.stringify(obj).replace(/-?\d[\d,]*\.?\d*/g, m => { add(Number(m.replace(/,/g, ''))); return m; });
  return pool;
}
function unverifiedIdx(evidence, pool) {
  const bad = [];
  (evidence || []).forEach((t, i) => {
    const nums = String(t).match(/\d[\d,]*\.?\d*/g) || [];
    const miss = nums.map(m => Number(m.replace(/,/g, ''))).filter(n => (n >= 10 || /\./.test(String(n))) && !(n >= 1900 && n <= 2100) && !pool.has(String(n)) && !pool.has(String(+n.toFixed(1))) && !pool.has(String(Math.round(n))));
    if (miss.length) bad.push(i);
  });
  return bad;
}

async function callAI(userText) {

    });

  } else {

    const u = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(S.settings.geminiModel)}:generateContent?key=${encodeURIComponent(key)}`;
    const r = await fetch(u, {

      body: JSON.stringify({ systemInstruction: { parts: [{ text: sys }] }, contents: [{ role: 'user', parts: [{ text: userText }] }], generationConfig: { temperature: 0.1, responseMimeType: 'application/json', ...(S._noSchema ? {} : { responseSchema: batch ? BATCH_SCHEMA : ONE_SCHEMA }) } }),
    });

    if (!r.ok && !S._noSchema && r.status === 400 && /schema|Unknown name|Invalid JSON payload/i.test(j?.error?.message || '')) { S._noSchema = true; return callAI(userText); }
    if (!r.ok) throw new Error(j?.error?.message || `Gemini HTTP ${r.status}`);

  }
}
function parseAIJson(t) {

function paintAiBtn() { const b = document.getElementById('aiAllBtn'); if (b && S.aiRunning) b.textContent = aiAllLabel(); }
async function coolDown(ms) {
  const end = Date.now() + ms;
  while (Date.now() < end) { S.aiCool = Math.ceil((end - Date.now()) / 1000); paintAiBtn(); await sleep(Math.min(1000, end - Date.now())); }
  S.aiCool = 0; paintAiBtn();
}
let _aiLast = 0;
async function aiThrottle() {
  const gap = 60000 / Math.max(1, num(S.settings.aiRpm) || 5) + 300;
  const wait = _aiLast + gap - Date.now();
  if (wait > 0) await (S.aiRunning ? coolDown(wait) : sleep(wait));
  _aiLast = Date.now();
}
function aiErrKind(msg) {
  if (/per ?day|PerDay|daily/i.test(msg)) return 'daily';
  if (/quota|rate|429|RESOURCE_EXHAUSTED|overloaded|529|503/i.test(msg)) return 'rate';
  return 'other';
}
function aiErrText(msg) {
  const k = aiErrKind(msg);
  if (k === 'daily') return '已用完今天的 AI 免費額度，明天會重置（或到 Google AI Studio 開啟付費）。';
  if (k === 'rate') return '暫時超過每分鐘的免費額度，稍後再試。';
  if (/API key not valid|API_KEY_INVALID|invalid x-api-key|authentication/i.test(msg)) return 'API Key 無效，請到「設定」重新貼上。';
  if (/not found|not supported/i.test(msg) && /model/i.test(msg)) return '模型名稱已失效，請到「設定」更新模型名稱。';

}
async function callAIQueued(text) {
  for (let attempt = 0; attempt < 4; attempt++) {
    if (S.aiStop) throw new Error('已停止');
    await aiThrottle();
    try { return await callAI(text); }
    catch (e) {
      const msg = String(e.message || e);
      if (aiErrKind(msg) !== 'rate' || attempt === 3) throw e;
      const sec = +(msg.match(/retry in ([\d.]+)s/i)?.[1] || 30);
      $('#hdrSub').textContent = `⏳ 達到每分鐘額度，${Math.ceil(sec)} 秒後自動重試…`;
      await coolDown((sec + 1.5) * 1000);
    }
  }
}

/* =========================================================
 *  集保 e 手掌握 PDF 匯入（pdf.js 於本機解析，檔案不上傳）
 * ========================================================= */
const PDFJS_VER = '4.10.38';
const PDFJS_BASE = new URL('vendor/pdfjs', location.href).href; // 本機化：不依賴第三方 CDN，離線也能解析
let _pdfjs = null;
async function loadPdfjs() {
  if (_pdfjs) return _pdfjs;
  const lib = await import(`${PDFJS_BASE}/build/pdf.min.mjs`);
  lib.GlobalWorkerOptions.workerSrc = `${PDFJS_BASE}/build/pdf.worker.min.mjs`;
  _pdfjs = lib;
  return lib;
}
async function pdfLines(file, password) {
  const lib = await loadPdfjs();
  const data = new Uint8Array(await file.arrayBuffer());
  const doc = await lib.getDocument({ data, password: password || undefined, cMapUrl: `${PDFJS_BASE}/cmaps/`, cMapPacked: true, isEvalSupported: false, standardFontDataUrl: `${PDFJS_BASE}/standard_fonts/` }).promise;
  const lines = [];
  for (let p = 1; p <= doc.numPages; p++) {
    const tc = await (await doc.getPage(p)).getTextContent();
    const rows = new Map();
    for (const it of tc.items) {
      const s = (it.str || '').trim(); if (!s) continue;
      const y = Math.round(it.transform[5] / 3);       // 同一列容許 ±3pt
      if (!rows.has(y)) rows.set(y, []);
      rows.get(y).push({ x: it.transform[4], w: it.width || 0, s });
    }
    [...rows.entries()].sort((a, b) => b[0] - a[0]).forEach(([, items]) => {
      items.sort((a, b) => a.x - b.x);
      lines.push({ page: p, items, text: items.map(i => i.s).join(' ') });
    });
  }
  return lines;
}
const TDCC_ROW = /(?:^|\s)(\d{4,6}[A-Z]?)\s+(\S+)\s+([\d,]+)\s+[\d,]+(?:\.\d+)?\s+\d{3,4}\/\d{1,2}\/\d{1,2}(?:\s|$)/;
function parseTdccPdf(lines) {
  // 只讀「庫存」區段；遇到「交易明細」區段就略過。股數欄位依表頭位置對齊。
  const out = []; let sect = 'inv'; let qtyX = null;
  const strict = lines.some(l => TDCC_ROW.test(l.text)); // 偵測到集保標準格式，就只採用標準格式的列
  for (const ln of lines) {
    const t = ln.text;
    if (/交易明細|異動明細/.test(t) && !/庫存/.test(t)) { sect = 'tx'; continue; }
    if (/庫存(明細|餘額)|餘額明細/.test(t)) { sect = 'inv'; }
    const hdr = ln.items.find(i => /(庫存|餘額|集保).{0,4}(股數|數量)|^(股數|數量|餘額|庫存股數|今日餘額|庫存數量)$/.test(i.s));
    if (hdr && /代號|名稱/.test(t)) { qtyX = hdr.x + hdr.w / 2; continue; }
    if (sect !== 'inv') continue;
    // 集保 e 手掌握實際格式：序號 代號 名稱 股數 參考價 日期 參考市值
    //   例：「2 1103 嘉泥 24 12.15 2026/11/23 291」
    const mm = t.match(TDCC_ROW);
    if (mm) {
      const shares = num(mm[3]);
      if (shares > 0) out.push({ code: mm[1], name: mm[2], shares: Math.round(shares), cost: null });
      continue;
    }
    if (strict) continue;
    // 備用：其他格式（代號可能和名稱黏在一起，例如「2330台積電」）
    const first = ln.items[0]?.s || '';
    const m = first.match(/^(\d{4,6}[A-Z]?)([^\d\/\-:.].*)?$/);
    if (!m) continue;
    let name = (m[2] || '').trim(); let rest = ln.items.slice(1);
    if (!name && rest.length && !/^[\d,.\-]+$/.test(rest[0].s)) { name = rest[0].s; rest = rest.slice(1); }
    const nums = rest.filter(i => /^-?[\d,]+(\.\d+)?$/.test(i.s)).map(i => ({ v: num(i.s), x: i.x + i.w / 2, int: !/\./.test(i.s) }));
    if (!nums.length) continue;
    let pick;
    if (qtyX != null) pick = nums.reduce((a, b) => Math.abs(b.x - qtyX) < Math.abs(a.x - qtyX) ? b : a);
    else pick = [...nums].reverse().find(n => n.int) || nums[nums.length - 1];
    if (pick?.v == null || pick.v <= 0) continue;
    out.push({ code: m[1], name, shares: Math.round(pick.v), cost: null });
  }
  return out;
}
async function importPdfs(files) {
  const st = $('#pdfStatus');
  const pw = ($('#pdfPw')?.value || '').trim().toUpperCase();
  st.innerHTML = '<div class="hint"><span class="spin"></span> 解析 PDF 中…</div>';
  const all = []; const logs = []; let sample = [];
  try { await loadPdfjs(); } catch (e) { st.innerHTML = `<div class="hint" style="color:var(--red)">PDF 解析元件載入失敗：${esc(e.message)}</div>`; return; }
  for (const f of files) {
    try {
      const lines = await pdfLines(f, pw);
      const rows = parseTdccPdf(lines);
      all.push(...rows);
      logs.push(`✅ ${f.name}：${rows.length} 檔`);
      if (!sample.length || !rows.length) sample = lines.filter(l => /\d{4}/.test(l.text)).slice(0, 40).map(l => l.text);
    } catch (e) {
      const msg = e?.name === 'PasswordException' ? (pw ? '密碼錯誤' : '需要密碼（請填身分證字號）') : (e.message || String(e));
      logs.push(`❌ ${f.name}：${msg}`);
    }
  }
  // 相同代號（不同券商）加總股數
  const merged = parseHoldings(all.map(r => `${r.code},${(r.name || '').replace(/,/g, ' ')},${r.shares}`).join('\n'));
  st.innerHTML = `<div class="hint">${logs.map(esc).join('<br>')}</div>` +
    (sample.length ? `<details class="hint"><summary>股數不對或讀不到？點這裡看 PDF 原始文字，截圖給 Claude 調整</summary><pre style="white-space:pre-wrap;font-size:11px">${esc(sample.join('\n'))}</pre></details>` : '');
  if (merged.list.length) {
    S.ui.importPreview = merged; S.ui.importMode = 'merge';
    const keepPw = $('#pdfPw').value, keepSt = st.innerHTML;
    renderHoldings(); $('#pdfPw').value = keepPw; $('#pdfStatus').innerHTML = keepSt;
    toast(`讀到 ${merged.list.length} 檔，請確認後按「確認匯入」`);
  }
}

function lastCheckpoint() {
  const times = String(S.settings.autoTimes || '').split(/[,，\s]+/).map(t => t.match(/^(\d{1,2}):(\d{2})$/)).filter(Boolean).map(m => [+m[1], +m[2]]);
  if (!times.length) return 0;
  const now = Date.now(); let best = 0;
  for (let d = 0; d < 8; d++) {
    const tw = new Date(now + 8 * 3600e3 - d * 864e5);
    for (const [hh, mm] of times) {
      const t = Date.UTC(tw.getUTCFullYear(), tw.getUTCMonth(), tw.getUTCDate(), hh, mm) - 8 * 3600e3;
      if (t <= now && t > best) best = t;
    }
  }
  return best;
}

    svg = `<line x1="0" y1="32" x2="100" y2="32" stroke="rgba(255,255,255,.15)" stroke-width=".4"/>` + v.map((x, i) => { const h = Math.abs(x.v) / max * 30; const y = x.v >= 0 ? 32 - h : 32; return `<rect x="${i * w + w * .15}" y="${y}" width="${w * .7}" height="${Math.max(h, .5)}" fill="${x.v >= 0 ? 'var(--up)' : 'var(--down)'}" rx=".6"/>`; }).join('');
  } else {
    const mn = Math.min(...v.map(x => x.v)), mx = Math.max(...v.map(x => x.v)), rg = mx - mn || 1;
    const pts2 = v.map((x, i) => `${i / (v.length - 1) * 100},${58 - (x.v - mn) / rg * 52}`).join(' ');
    svg = `<polyline points="${pts2}" fill="none" stroke="var(--accent)" stroke-width="1.6" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>`;
  }
  const data = esc(JSON.stringify({ k: kind, u: unit, d: v.map(x => x.d), v: v.map(x => +(+x.v).toFixed(2)) }));
  const last = v[v.length - 1];
  return `<div class="chart-wrap" data-series="${data}">
    <svg class="chart" viewBox="0 0 100 64" preserveAspectRatio="none">${svg}<line class="cur" x1="0" x2="0" y1="0" y2="64" stroke="rgba(255,255,255,.55)" stroke-width=".5" vector-effect="non-scaling-stroke" style="display:none"/></svg>
    <div class="readout"><span>${prettyDate(v[0].d).slice(5)}</span><b>${prettyDate(last.d).slice(5)}：${fmt(last.v, unit === '%' ? 2 : unit === '元' ? 2 : 0)}${unit}</b></div>
  </div>`;
}
function scrub(wrap, clientX) {
  const s = JSON.parse(wrap.dataset.series); const r = wrap.querySelector('svg').getBoundingClientRect();
  const ratio = Math.min(1, Math.max(0, (clientX - r.left) / r.width));
  const i = s.k === 'bar' ? Math.min(s.v.length - 1, Math.floor(ratio * s.v.length)) : Math.round(ratio * (s.v.length - 1));
  const x = s.k === 'bar' ? (i + .5) / s.v.length * 100 : i / Math.max(1, s.v.length - 1) * 100;
  const cur = wrap.querySelector('.cur'); cur.setAttribute('x1', x); cur.setAttribute('x2', x); cur.style.display = '';
  const d = s.u === '%' || s.u === '元' ? 2 : 0;
  wrap.querySelector('.readout').innerHTML = `<span>按住左右滑動</span><b>${prettyDate(s.d[i])}：${s.v[i] > 0 && s.k === 'bar' ? '+' : ''}${fmt(s.v[i], d)}${s.u}</b>`;
}

/* =========================================================
 *  日期工具：最後買進日（約）
 * ========================================================= */
function ymdToDate(s) { return new Date(Date.UTC(+s.slice(0, 4), +s.slice(4, 6) - 1, +s.slice(6, 8))); }
function addDays(s, n) { return ymd(new Date(ymdToDate(s).getTime() + n * 864e5)); }
function isWeekend(s) { const d = ymdToDate(s).getUTCDay(); return d === 0 || d === 6; }
function prevTradingDays(s, n) { let d = s; while (n > 0) { d = addDays(d, -1); if (!isWeekend(d)) n--; } return d; }
/* 股東常會前 60 天、臨時會前 30 天停止過戶；最後過戶日＝停止過戶前一天；最後買進日＝最後過戶日前 2 個交易日（T+2 交割） */
function agmDates(agm) {
  if (!agm?.date) return null;
  const extra = /臨時/.test(agm.type || '');
  const closeStart = addDays(agm.date, extra ? -30 : -60);
  const lastTransfer = addDays(closeStart, -1);
  const lastBuy = isWeekend(lastTransfer) ? prevTradingDays(lastTransfer, 2) : prevTradingDays(lastTransfer, 2);
  return { extra, closeStart, lastTransfer, lastBuy };
}

/* =========================================================
 *  健康分數（五個面向，各 1～5 分）
 * ========================================================= */
function healthOf(code) {
  const s = S.market?.stocks?.[code] || {}; const etf = isETF(code); const al = evaluate(code);
  const clamp = v => Math.max(1, Math.min(5, Math.round(v)));
  const yoy = s.rev?.yoy;
  const growth = etf || yoy == null ? null : yoy >= 30 ? 5 : yoy >= 10 ? 4 : yoy >= -5 ? 3 : yoy >= -20 ? 2 : 1;
  const eps = s.eps?.eps, om = s.prof?.om;
  const profit = etf || eps == null ? null : eps < 0 ? 1 : om == null ? 3 : om >= 15 ? 5 : om >= 8 ? 4 : om >= 3 ? 3 : 2;
  const y = s.pe?.yld ?? s.div?.yldCalc;
  const divi = y == null ? null : y >= 6 ? 5 : y >= 4 ? 4 : y >= 2 ? 3 : y > 0 ? 2 : 1;
  let chip = 3, safe = 5;
  for (const a of al) {
    if (a.k === 'big' || a.k === 'insti') chip += a.lv === 'red' ? -1 : a.lv === 'green' ? 1 : 0;
    if (a.k === 'pledge') chip -= 1;
    if (a.k === 'credit') chip -= 0.5;
    if (a.k === 'punish') safe -= 3;
    if (a.k === 'notice') safe -= 1;
    if (a.k === 'drop') safe -= a.lv === 'red' ? 2 : 1;
    if (a.k === 'news' && a.lv === 'red') safe -= 1;
    if (a.k === 'eps') safe -= 0.5;
  }
  const hasChip = tdccSeries(code).length || instiSeries(code).length;
  const axes = [['成長', growth], ['獲利', profit], ['股息', divi], ['籌碼', hasChip ? clamp(chip) : null], ['安全', S.market ? clamp(safe) : null]];
  const vals = axes.filter(a => a[1] != null).map(a => a[1]);
  const score = vals.length >= 2 ? Math.round(vals.reduce((a, b) => a + b, 0) / vals.length * 20) : null;
  return { axes, score };
}
function healthLabel(sc) { return sc == null ? '資料不足' : sc >= 80 ? '很健康' : sc >= 65 ? '穩定' : sc >= 50 ? '普通' : '需留意'; }
function healthColor(sc) { return sc == null ? 'var(--tx3)' : sc >= 80 ? 'var(--green)' : sc >= 65 ? '#64d2ff' : sc >= 50 ? 'var(--yellow)' : 'var(--red)'; }
const AXIS_TIP = { 成長: '營收比去年同期的變化', 獲利: '公司有沒有賺錢、本業利潤率', 股息: '殖利率高低', 籌碼: '大股東與大型機構的動向', 安全: '有沒有處置、急跌、重大負面消息' };
function radarSvg(axes, size = 150) {
  const cx = size / 2, cy = size / 2 + 4, R = size / 2 - 26, n = axes.length;
  const pt = (i, r) => { const a = -Math.PI / 2 + i * 2 * Math.PI / n; return [cx + Math.cos(a) * r, cy + Math.sin(a) * r]; };
  const ring = k => axes.map((_, i) => pt(i, R * k / 5).join(',')).join(' ');
  const poly = axes.map((a, i) => pt(i, R * (a[1] ?? 0) / 5).join(',')).join(' ');
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" class="radar">
    ${[1, 2, 3, 4, 5].map(k => `<polygon points="${ring(k)}" fill="none" stroke="rgba(255,255,255,${k === 5 ? .22 : .09})" stroke-width="1"/>`).join('')}
    ${axes.map((_, i) => { const [x, y] = pt(i, R); return `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="rgba(255,255,255,.09)"/>`; }).join('')}
    <polygon points="${poly}" fill="rgba(10,132,255,.32)" stroke="#0a84ff" stroke-width="1.6" stroke-linejoin="round"/>
    ${axes.map((a, i) => { const [x, y] = pt(i, R + 14); return `<text x="${x}" y="${y + 4}" text-anchor="middle" font-size="11" fill="${a[1] == null ? 'rgba(235,235,245,.3)' : 'rgba(235,235,245,.75)'}">${a[0]}${a[1] == null ? '' : ' ' + a[1]}</text>`; }).join('')}
  </svg>`;
}
function healthBlock(code) {
  const h = healthOf(code);
  const known = h.axes.filter(a => a[1] != null);
  const weak = known.length ? known.reduce((a, b) => b[1] < a[1] ? b : a) : null;
  const strong = known.length ? known.reduce((a, b) => b[1] > a[1] ? b : a) : null;
  return `<div class="health">
    ${radarSvg(h.axes)}
    <div class="grow">
      <small>健康分數 ${gl('health')}</small>
      <div class="hs" style="color:${healthColor(h.score)}">${h.score ?? '—'}<span>${healthLabel(h.score)}</span></div>
      ${strong && weak && strong !== weak ? `<div class="small muted">最好：${strong[0]}（${AXIS_TIP[strong[0]]}）<br>最弱：${weak[0]}（${AXIS_TIP[weak[0]]}）</div>` : '<div class="small faint">資料累積越多天，分數越準</div>'}
    </div>
  </div>`;
}
function portfolioHealth() {
  let w = 0, sum = 0;
  for (const h of S.holdings) { const sc = healthOf(h.code).score; if (sc == null) continue; const v = holdValue(h.code) || 1; w += v; sum += sc * v; }
  return w ? Math.round(sum / w) : null;
}

/* =========================================================
 *  產業分布
 * ========================================================= */
const IND = { '01': '水泥', '02': '食品', '03': '塑膠', '04': '紡織纖維', '05': '電機機械', '06': '電器電纜', '08': '玻璃陶瓷', '09': '造紙', '10': '鋼鐵', '11': '橡膠', '12': '汽車', '14': '建材營造', '15': '航運', '16': '觀光餐旅', '17': '金融保險', '18': '貿易百貨', '19': '綜合', '20': '其他', '21': '化學', '22': '生技醫療', '23': '油電燃氣', '24': '半導體', '25': '電腦週邊', '26': '光電', '27': '通信網路', '28': '電子零組件', '29': '電子通路', '30': '資訊服務', '31': '其他電子', '32': '文化創意', '33': '農業科技', '34': '電子商務', '35': '綠能環保', '36': '數位雲端', '37': '運動休閒', '38': '居家生活' };
function industryOf(code) {
  if (isETF(code)) return 'ETF';
  const raw = S.market?.stocks?.[code]?.industry || '';
  return IND[raw.padStart(2, '0')] || raw.replace(/工業|業$/g, '') || '未分類';
}
function industryDist() {
  const m = new Map(); let tot = 0;
  for (const h of S.holdings) { const v = holdValue(h.code); if (!v) continue; const k = industryOf(h.code); const o = m.get(k) || { v: 0, n: 0 }; o.v += v; o.n++; m.set(k, o); tot += v; }
  const rows = [...m.entries()].map(([k, o]) => ({ k, ...o, p: tot ? o.v / tot * 100 : 0 })).sort((a, b) => b.v - a.v);
  return { rows, tot };
}

/* =========================================================
 *  股息與股東會事件
 * ========================================================= */
function dividendEvents() {
  const today = ymd(twNow()); const out = [];
  for (const h of S.holdings) {
    const s = S.market?.stocks?.[h.code]; if (!s) continue;
    if (s.exdiv?.date && s.exdiv.date >= today) {
      const per = s.exdiv.cash ?? null;
      out.push({ type: 'ex', date: s.exdiv.date, code: h.code, name: nameOf(h.code), per, amt: per && h.shares ? per * h.shares : null, kind: s.exdiv.type || '息' });
    }
    const ad = agmDates(s.agm);
    if (ad && s.agm.date >= today) out.push({ type: 'agm', date: s.agm.date, lastBuy: ad.lastBuy, lastTransfer: ad.lastTransfer, extra: ad.extra, code: h.code, name: nameOf(h.code) });
  }
  return out.sort((a, b) => a.date.localeCompare(b.date));
}
function annualDividend() {
  let total = 0, n = 0;
  for (const h of S.holdings) { const c = S.market?.stocks?.[h.code]?.div?.cash; if (c && h.shares) { total += c * h.shares; n++; } }
  return { total, n };
}

/* =========================================================
 *  加入 iPhone 行事曆（.ics）
 * ========================================================= */
function icsEsc(t) { return String(t).replace(/\\/g, '\\\\').replace(/[,;]/g, m => '\\' + m).replace(/\n/g, '\\n'); }
function buildIcs() {
  const ev = dividendEvents(); const limit = addDays(ymd(twNow()), 180);
  const groups = new Map(); // 同一天同類型合併成一個事件
  const push = (date, key, title, line) => { if (date > limit) return; const k = date + '|' + key; const g = groups.get(k) || { date, title, lines: [] }; g.lines.push(line); groups.set(k, g); };
  for (const e of ev) {
    if (e.type === 'ex') push(e.date, 'ex', '除權息', `${e.code} ${e.name}${e.per ? ` 每股 ${fmt(e.per, 2)} 元` : ''}${e.amt ? `，約領 ${fmt(e.amt)} 元` : ''}`);
    else { push(e.lastTransfer, 'keep', '股東會資格：持有到今天', `${e.code} ${e.name}（${e.extra ? '臨時會' : '常會'} ${prettyDate(e.date).slice(5)}）`); }
  }
  const stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+/, '');
  const L = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//tw-stock-radar//zh-TW', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH', 'X-WR-CALNAME:持股雷達'];
  for (const [k, g] of groups) {
    const title = `${g.title}（${g.lines.length} 檔）`;
    L.push('BEGIN:VEVENT', `UID:${k.replace('|', '-')}@tw-stock-radar`, `DTSTAMP:${stamp}`, `DTSTART;VALUE=DATE:${g.date}`, `DTEND;VALUE=DATE:${addDays(g.date, 1)}`,
      `SUMMARY:${icsEsc(title)}`, `DESCRIPTION:${icsEsc(g.lines.slice(0, 25).join('\n') + (g.lines.length > 25 ? `\n…另 ${g.lines.length - 25} 檔，請到 App 查看` : '') + '\n\n日期為依官方資料推算，以公司公告為準。')}`,
      'BEGIN:VALARM', 'ACTION:DISPLAY', `DESCRIPTION:${icsEsc(title)}`, 'TRIGGER:-PT15H', 'END:VALARM', 'END:VEVENT');
  }
  L.push('END:VCALENDAR');
  return { text: L.join('\r\n'), count: groups.size };
}
async function addToCalendar() {
  const { text, count } = buildIcs();
  if (!count) { toast('未來半年內沒有可加入的日期'); return; }
  const file = new File([text], '持股雷達行事曆.ics', { type: 'text/calendar' });
  const url = URL.createObjectURL(file);
  const w = window.open(url, '_blank');
  if (!w) { const a = document.createElement('a'); a.href = url; a.download = file.name; document.body.appendChild(a); a.click(); a.remove(); }
  toast(`已產生 ${count} 個提醒，請點「全部加入」`, 3500);
  setTimeout(() => URL.revokeObjectURL(url), 60000);
}

      ${pv ? `
        <div class="sep"></div>
        <div class="row between"><b>解析結果：${pv.list.length} 檔</b>${pv.bad.length ? `<span class="chip red">${pv.bad.length} 行無法辨識</span>` : ''}</div>
        ${pv.bad.length ? `<div class="hint">${pv.bad.slice(0, 5).map(esc).join('<br>')}${pv.bad.length > 5 ? '<br>…' : ''}</div>` : ''}
        <div class="small muted" style="margin:6px 0">${pv.list.slice(0, 6).map(h => `${h.code}×${fmt(h.shares)}`).join('、')}${pv.list.length > 6 ? '…' : ''}</div>
        <div class="seg" style="margin:8px 0">
          <button data-im="merge" class="${S.ui.importMode === 'merge' ? 'on' : ''}">合併（同代號覆寫）</button>
          <button data-im="replace" class="${S.ui.importMode === 'replace' ? 'on' : ''}">整份取代</button>

    </div>

    ${(() => { const lb = S.settings.lastBackup; const days = lb ? Math.floor((Date.now() - lb) / 864e5) : null;
      if (!S.holdings.length) return '';
      return `<div class="backup-banner ${days == null || days > 14 ? 'warn' : ''}" data-act="export">
        <span>${days == null ? '還沒有備份過持股名單' : days === 0 ? '今天已備份' : `距離上次備份：${days} 天`}</span><b>${days != null && days <= 14 ? '再備份一次 ›' : '立即備份 ›'}</b></div>`; })()}
    <div class="card">
      <h3>💾 備份與還原</h3>
      <div class="small muted">清除 Safari 網站資料會一併刪除本機持股，建議每次調整名單後匯出備份到「檔案」App 或 iCloud。（備份不含 API Key）</div>
      <div class="row" style="margin-top:10px">
        <button class="btn grow" data-act="export">⬆️ 匯出 JSON</button>
        <button class="btn grow" data-act="pickjson">⬇️ 匯入還原</button>
      </div>
    </div>

    <div class="card">
      <div class="row between"><h3 style="margin:0">目前持股 ${S.holdings.length} 檔</h3>${S.holdings.length ? '<button class="btn sm danger" data-act="clearh">清空</button>' : ''}</div>
      ${S.holdings.length ? `<div class="small muted" style="margin:6px 0">成本 ${fmt(totalCost)} 元${totalMv ? ` · 市值 ${fmt(totalMv)} 元 · ${sgn(totalCost ? (totalMv - totalCost) / totalCost * 100 : null)}` : ''}</div>
      <table><thead><tr><th>代號</th><th>名稱</th><th class="r">股數</th><th class="r">均價</th><th></th></tr></thead><tbody>
      ${S.holdings.slice(0, S.ui.lim.holdings).map(h => `<tr><td class="mono">${h.code}</td><td>${esc(nameOf(h.code))}</td><td class="r mono money">${fmt(h.shares)}</td><td class="r mono money">${fmt(h.cost, 2)}</td><td class="r"><button class="btn sm" data-act="delh" data-code="${h.code}">✕</button></td></tr>`).join('')}
      </tbody></table>${sentinel('holdings', S.holdings.length - S.ui.lim.holdings)}` : '<div class="faint small" style="margin-top:8px">尚無持股</div>'}
    </div>`;
}

      <div class="row" style="margin-top:10px">
        <button class="btn pri grow" data-act="update" ${S.busy ? 'disabled' : ''}>${S.busy ? '<span class="spin"></span> 更新中' : '🔄 立即更新全市場官方數據'}</button>
      </div>

        <span>⏰ 打開 App 時自動更新</span>

      </div>

      <input data-set="autoTimes" value="${esc(T.autoTimes)}" placeholder="16:30, 21:30" inputmode="numeric">
      <div class="hint">iPhone 不允許網頁 App 在關閉時於背景執行，所以是「過了時間點後，你第一次打開或切回 App 時自動更新」。建議 16:30（三大法人、融資融券已公布）與 21:30（晚間重訊、月營收）。</div>
      <div style="margin-top:12px">
        ${DS.map(([k, label]) => { const st = S.sources[k] || {}; const cls = st.state === 'ok' ? 'ok' : st.state === 'err' ? 'err' : st.state === 'empty' ? 'empty' : ''; return `<div class="dsrow" data-ds="${k}"><span class="lb">${label}</span><div class="prog"><i class="${cls}" style="width:${st.state && st.state !== 'wait' ? '100%' : '0'}"></i></div><span class="st">${st.state === 'ok' ? (st.note || '完成') : st.state === 'err' ? '失敗' : st.state === 'empty' ? '無資料' : '—'}</span></div>`; }).join('')}
      </div>
      <div class="hint">最後成功更新：${S.market ? new Date(S.market.updatedAt).toLocaleString('zh-TW') : '—'}<br>集保大戶資料週期：${S.market?.tdccDate ? prettyDate(S.market.tdccDate) : '—'}；已累積法人 ${Object.keys(S.hist.insti).length} 日、大戶 ${Object.keys(S.hist.tdcc).length} 週</div>
      <div class="row" style="margin-top:10px"><button class="btn sm" data-act="probe">🩺 端點診斷</button></div>
      <div id="probeOut"></div>
    </div>

    <div class="card">
      <h3>🤖 AI 查核員</h3>
      <div class="seg" style="margin-bottom:6px">
        <button data-prov="gemini" class="${T.aiProvider === 'gemini' ? 'on' : ''}">Gemini</button>
        <button data-prov="claude" class="${T.aiProvider === 'claude' ? 'on' : ''}">Claude</button>
      </div>
      <label class="f">Gemini API Key</label>
      <input type="password" data-key="key_gemini" value="${esc(LS.get('key_gemini'))}" placeholder="AIza…" autocomplete="off">
      <label class="f">Gemini 模型</label>
      <input data-set="geminiModel" value="${esc(T.geminiModel)}" autocapitalize="off">
      <label class="f">Claude API Key</label>
      <input type="password" data-key="key_claude" value="${esc(LS.get('key_claude'))}" placeholder="sk-ant-…" autocomplete="off">
      <label class="f">Claude 模型</label>
      <input data-set="claudeModel" value="${esc(T.claudeModel)}" autocapitalize="off">
      <div class="grid2">
        <div><label class="f">每分鐘最多請求</label><input type="number" inputmode="numeric" data-set="aiRpm" value="${T.aiRpm}"></div>
        <div><label class="f">批次每次合併檔數</label><input type="number" inputmode="numeric" data-set="aiBatch" value="${T.aiBatch}"></div>
      </div>
      <div class="hint">Gemini 免費版每分鐘 5 次；付費後可調高。合併檔數越多越省次數，但單次回覆較慢（建議 3～5）。</div>
      <div class="hint">API Key 只存在這支 iPhone 的 localStorage，直接從手機呼叫 Google / Anthropic，不經過 Worker、不會寫入備份檔。</div>

    <div class="card">
      <h3>🎚️ 異常閾值</h3>
      <div class="grid2">
        ${numIn('revDown', '營收 YoY ≤ (%) 高風險')}
        ${numIn('revUp', '營收 YoY ≥ (%) 利多')}
        ${numIn('bigWeeks', '千張大戶連續減少(週)')}
        ${numIn('bigDrop', '且累計減少 ≥ (百分點)', 0.1)}
        ${numIn('instiDays', '法人連續賣超(日)')}
        ${numIn('instiLots', '查不到股本時：累計 ≥ (張)')}
        ${numIn('creditJump', '融資單日增加 ≥ (%)')}
        ${numIn('newsDays', '重訊回看天數')}
        ${numIn('yieldHigh', '高殖利率標籤 ≥ (%)', 0.5)}
        ${numIn('backfillDays', '上市法人回補日數')}
        ${numIn('instiPct', '法人累計占股本 ≥ (%)', 0.01)}
        ${numIn('creditPct', '融資增加占股本 ≥ (%)', 0.01)}
        ${numIn('pledgeHigh', '董監質押 ≥ (%)')}
        ${numIn('drop5', '近 5 日跌幅 ≥ (%)')}
        ${numIn('tierMain', '主力持股：市值 ≥ (元)', 1000)}
        ${numIn('tierMid', '一般持股：市值 ≥ (元)', 100)}
      </div>
      <div class="row between" style="margin-top:12px">
        <span class="small">漲跌配色：${T.colorIntl ? '國際（綠漲紅跌）' : '台股（紅漲綠跌）'}</span>
        <button class="btn sm" data-act="color">切換</button>

    <div class="card">
